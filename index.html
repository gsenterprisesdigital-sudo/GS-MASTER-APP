function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){if(!warned){warned=true;toast('Could not save on this device. Download a backup from More.',true)}}}
function dayLog(){const t=today();if(!S.daily.log[t]){S.daily.log[t]={done:[],emails:0};const keys=Object.keys(S.daily.log).sort();while(keys.length>60)delete S.daily.log[keys.shift()]}return S.daily.log[t]}
function planInfo(p){const total=p.tasks.length,done=p.tasks.filter(t=>t.d).length;let day=null,days=null;if(p.start&&p.end){days=dayDiff(p.end,p.start)+1;day=Math.min(days,Math.max(0,dayDiff(today(),p.start)+1))}return {total,done,pct:total?done/total:0,day,days}}

const nav=(l,c,r)=>`<div class="top"><div class="top-in">${l||'<span></span>'}${c||'<span></span>'}${r||'<span></span>'}</div></div>`;
const addBtn=k=>`<button class="nb" data-new="${k}" aria-label="Add">${ICON.plus}</button>`;
const searchBox=ph=>`<label class="search">${ICON.search}<input id="q" type="search" placeholder="${ph}" value="${esc(q)}" autocomplete="off" enterkeyhint="search" aria-label="${ph}"></label>`;
const cb=(href,label,icon)=>href?`<a class="cb" href="${esc(href)}" ${/^https?:/.test(href)?'target="_blank" rel="noopener"':''}><span class="cbi">${icon}</span>${label}</a>`:`<span class="cb off"><span class="cbi">${icon}</span>${label}</span>`;
function planCard(p){const i=planInfo(p);return `<button class="card plan" data-plan="${p.id}"><div class="ph"><b>${esc(p.title||'Untitled plan')}</b>${i.days?`<span class="when">${i.day?`Day ${i.day} of ${i.days}`:`Starts ${niceDate(p.start)}`}</span>`:''}</div>${p.sub?`<p class="meta">${esc(p.sub)}</p>`:''}${i.total?`<div class="bar"><i style="width:${Math.round(i.pct*100)}%"></i></div><p class="meta">${i.done} of ${i.total} tasks done</p>`:''}</button>`}

function homeView(){const p=S.profile,g=S.goals,lg=S.daily.log[today()]||{done:[],emails:0},tasks=S.daily.tasks,emDone=lg.emails>=g.emailsGoal;
const doneN=tasks.filter(t=>lg.done.includes(t.id)).length+(emDone?1:0),totalN=tasks.length+1,pct=doneN/totalN,ph=digits(p.phone);
const dated=S.plans.filter(x=>x.start&&x.end&&planInfo(x).day<planInfo(x).days+1),favs=S.links.filter(l=>l.fav&&l.url),tgt=Math.max(1,g.target);
const day=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Kolkata'});
return nav('','<span class="tt">Home</span>','')+`<main class="wrap"><h1>${esc(p.name)}</h1><p class="sub">${esc(p.tagline)}</p>
<div class="card"><div class="who"><span class="av lg">${esc(initials(p.name))}</span><div><b>${esc(p.founder)}</b><span>${esc([p.role,p.city].filter(Boolean).join(' · '))}</span></div></div>
<div class="cbtns">${cb(p.email&&'mailto:'+p.email,'Email',ICON.mail)}${cb(ph&&'tel:+'+ph,'Call',ICON.phone)}${cb(ph&&'https://wa.me/'+ph,'WhatsApp',ICON.wa)}${cb(p.website,'Website',ICON.globe)}</div></div>
<div class="shead"><p class="sec">Today · ${esc(day)}</p><button class="link small" data-open="daily">Edit</button></div>
<div class="card"><div class="th"><svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="rt" cx="18" cy="18" r="15.5"/><circle class="rv" cx="18" cy="18" r="15.5" stroke-dasharray="${(pct*97.4).toFixed(1)} 97.4"/></svg><div><b>${doneN} of ${totalN}</b><span>${doneN===totalN?'All done for today':'daily tasks done'}</span></div></div></div>
<div class="group">${tasks.map(t=>{const on=lg.done.includes(t.id);return `<button class="row plain" data-daily="${t.id}"><span class="ck ${on?'on':''}">${ICON.check}</span><span class="t ${on?'struck':''}">${esc(t.t)}</span></button>`}).join('')}
<div class="row plain"><span class="ck ${emDone?'on':''}">${ICON.check}</span><span class="t ${emDone?'struck':''}" style="flex:1">Outreach emails</span><span class="when">${lg.emails}/${g.emailsGoal}</span><span class="step"><button data-em="-1" aria-label="One less email">−</button><button data-em="1" aria-label="One more email">+</button></span></div></div>
${dated.length?`<p class="sec">Running plans</p>${dated.map(planCard).join('')}<div style="height:12px"></div>`:''}
<p class="sec">Goal</p><div class="card"><div class="gl"><div><b>${g.clients} of ${g.target}</b><span>paying clients</span></div><span class="step"><button data-cl="-1" aria-label="One less client">−</button><button data-cl="1" aria-label="One more client">+</button></span></div><div class="bar"><i style="width:${Math.min(100,g.clients/tgt*100)}%"></i></div><p class="meta">Monthly revenue now ${inr(g.clients*g.fee)} · at ${g.target} clients ${inr(g.target*g.fee)}</p></div>
${favs.length?`<p class="sec">Quick links</p><div class="qlinks">${favs.map(l=>`<a class="ql" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="av sm" style="background:${GC[l.group]||GC.Other}">${esc(initials(l.title))}</span><span>${esc(l.title)}</span></a>`).join('')}</div>`:''}
${p.goal?`<p class="sec">Long-term goal</p><div class="card"><p class="body">${esc(p.goal)}</p></div>`:''}</main>`}

function linkRow(l){return `<div class="row"><a class="rowlink" ${l.url?`href="${esc(l.url)}" target="_blank" rel="noopener"`:`data-link="${l.id}" role="button" tabindex="0"`}><span class="av" style="background:${GC[l.group]||GC.Other}">${esc(initials(l.title))}</span><span class="rc"><span class="t">${esc(l.title||'Untitled')}${l.fav?' ★':''}</span><span class="s">${esc(l.url?host(l.url):(l.note||'Tap to add the link'))}</span></span>${l.url?'':badge('Add link','#FF9500')}</a><button class="more" data-link="${l.id}" aria-label="Edit ${esc(l.title)}">${ICON.dots}</button></div>`}
function linksList(){const s=q.trim().toLowerCase(),list=S.links.filter(l=>!s||[l.title,l.url,l.note,l.group].some(v=>String(v||'').toLowerCase().includes(s)));if(!list.length)return '<div class="empty"><b>No links found</b>Try another word, or tap + to add one.</div>';
const gs=[...new Set([...GROUPS,...list.map(l=>l.group||'Other')])].filter(g=>list.some(l=>(l.group||'Other')===g));
return gs.map(g=>`<p class="sec">${esc(g)}</p><div class="group">${list.filter(l=>(l.group||'Other')===g).map(linkRow).join('')}</div>`).join('')}
function linksView(){return nav('','<span class="tt">Links</span>',addBtn('link'))+`<main class="wrap"><h1>Links</h1><p class="sub">${S.links.filter(l=>l.url).length} saved · ${S.links.filter(l=>!l.url).length} to add</p>${searchBox('Search links')}<div id="list">${linksList()}</div></main>`}
function plansView(){return nav('','<span class="tt">Plans</span>',addBtn('plan'))+`<main class="wrap"><h1>Plans</h1><p class="sub">${S.plans.length} plans · ${S.plans.reduce((n,p)=>n+p.tasks.filter(t=>!t.d).length,0)} open tasks</p>${S.plans.length?S.plans.map(planCard).join(''):'<div class="empty"><b>No plans yet</b>Tap + to start one.</div>'}</main>`}
function notesList(){const s=q.trim().toLowerCase(),list=S.notes.filter(n=>!s||[n.title,n.body].some(v=>String(v||'').toLowerCase().includes(s))).sort((a,b)=>(b.pin-a.pin)||(b.ts-a.ts));
if(!list.length)return `<div class="empty"><b>${s?'No notes found':'No notes yet'}</b>${s?'Try another word.':'Tap + to write one.'}</div>`;
return `<div class="group">${list.map(n=>`<button class="row plain" data-note="${n.id}" style="padding-left:16px"><span class="rc"><span class="t" style="font-weight:600">${esc(n.title||'Untitled')}</span><span class="s">${esc(rel(n.ts))} · ${esc(String(n.body||'').split('\n')[0]||'No text')}</span></span>${n.pin?badge('Pinned','#FF9500'):''}</button>`).join('')}</div>`}
function notesView(){return nav('','<span class="tt">Notes</span>',addBtn('note'))+`<main class="wrap"><h1>Notes</h1><p class="sub">${S.notes.length} notes</p>${searchBox('Search notes')}<div id="list">${notesList()}</div></main>`}
function moreView(){const r=(x,t,s)=>`<button class="row plain" data-${x} style="padding-left:16px"><span class="rc"><span class="t link">${t}</span>${s?`<span class="s">${s}</span>`:''}</span></button>`;
return nav('','<span class="tt">More</span>','')+`<main class="wrap"><h1>More</h1><p class="sub">Settings and backup</p>
<p class="sec">Business</p><div class="group">${r('open="profile"','Business profile','Name, tagline, contact, long-term goal')}${r('open="daily"','Daily checklist','Edit your everyday tasks')}${r('open="goals"','Goals','Client target, average fee, daily emails')}</div>
<p class="sec">Backup</p><div class="group">${r('x="backup"','Download backup','Save everything as a file')}<label class="row plain" style="padding-left:16px;cursor:pointer"><span class="rc"><span class="t link">Restore from backup</span><span class="s">Choose a GS Master backup file</span></span><input type="file" id="restore" accept=".json,application/json" hidden></label></div>
<div class="group"><button class="row plain" data-x="reset" style="padding-left:16px;justify-content:center"><span class="t danger">Reset to starting data</span></button></div>
<p class="note" style="margin-top:0">Everything is saved on this device. Download a backup now and then, and restore it on another phone or laptop.</p></main>`}
function render(){$('tabbar').innerHTML=`<div class="tabbar-in">${[['home','Home',ICON.home],['links','Links',ICON.link],['plans','Plans',ICON.plan],['notes','Notes',ICON.note],['more','More',ICON.more]].map(([k,l,i])=>`<button class="tab ${view===k?'on':''}" data-nav="${k}" aria-label="${l}">${i}<span>${l}</span></button>`).join('')}</div>`;
app.innerHTML=({home:homeView,links:linksView,plans:plansView,notes:notesView,more:moreView}[view]||homeView)();document.body.classList.toggle('scrolled',scrollY>30)}

function fld(o,k,label,type='text',extra=''){return `<label class="f"><small>${label}</small><input type="${type}" data-f="${k}" value="${esc(o[k]??'')}" autocomplete="off" ${extra}></label>`}
function ta(o,k,label,cls=''){return `<label class="f"><small>${label}</small><textarea class="${cls}" data-f="${k}">${esc(o[k]??'')}</textarea></label>`}
function tog(o,k,label){return `<label class="f sw"><span>${label}</span><input type="checkbox" class="switch" data-f="${k}" ${o[k]?'checked':''}></label>`}
function taskRows(list,kind){return list.map(t=>`<div class="row plain task">${kind==='plan'?`<button class="ck ${t.d?'on':''}" data-tc="${t.id}" aria-label="Mark done">${ICON.check}</button>`:`<span class="ck">${ICON.check}</span>`}<input class="tin ${t.d?'struck':''}" data-tt="${t.id}" value="${esc(t.t)}" aria-label="Task"><button class="x" data-tdel="${t.id}" aria-label="Delete task">×</button></div>`).join('')+`<div class="row plain task"><span class="ck add">${ICON.plus}</span><input class="tin" id="newtask" placeholder="Add a task" enterkeyhint="done" autocomplete="off"><button class="link" data-x="addtask">Add</button></div>`}
function renderSheet(keep){if(!sheet){sh.innerHTML='';document.body.classList.remove('lock');return}document.body.classList.add('lock');
const sc=keep?sh.querySelector('.sbody')?.scrollTop||0:0,{kind,obj}=sheet;let title='',body='';
if(kind==='link'){title=sheet.isNew?'New link':'Link';body=`${obj.url?`<div class="acts3"><a class="act" href="${esc(obj.url)}" target="_blank" rel="noopener">Open</a><button class="act" data-x="copy">Copy</button><button class="act" data-x="share">Share</button></div>`:''}
<div class="group">${fld(obj,'title','Name','text','autocapitalize="words"')}${fld(obj,'url','Link','url','inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://"')}<label class="f"><small>Group</small><select data-f="group">${GROUPS.map(g=>`<option ${g===(obj.group||'Other')?'selected':''}>${g}</option>`).join('')}</select></label>${fld(obj,'note','Note')}</div>
<div class="group">${tog(obj,'fav','Show on Home')}</div><button class="btn" data-x="delete">Delete link</button>`}
else if(kind==='plan'){const i=planInfo(obj);title=sheet.isNew?'New plan':'Plan';body=`<div class="group">${fld(obj,'title','Plan name','text','autocapitalize="sentences"')}${fld(obj,'sub','Short description')}${fld(obj,'start','Start date','date')}${fld(obj,'end','End date','date')}</div>
<p class="sec">Tasks · ${i.done} of ${i.total} done</p><div class="group">${taskRows(obj.tasks,'plan')}</div><div class="group">${ta(obj,'notes','Notes')}</div><button class="btn" data-x="delete">Delete plan</button>`}
else if(kind==='note'){title=sheet.isNew?'New note':'Note';body=`<div class="group">${fld(obj,'title','Title','text','autocapitalize="sentences"')}</div><div class="group">${ta(obj,'body','Note','big')}</div><div class="group">${tog(obj,'pin','Pin to top')}</div><p class="meta" style="margin:-14px 16px 18px">Edited ${esc(rel(obj.ts))}</p><button class="btn" data-x="delete">Delete note</button>`}
else if(kind==='profile'){title='Business profile';body=`<div class="group">${fld(obj,'name','Business name')}${fld(obj,'tagline','Tagline')}${fld(obj,'founder','Founder')}${fld(obj,'role','Role')}${fld(obj,'city','City')}</div><div class="group">${fld(obj,'email','Email','email','autocapitalize="off"')}${fld(obj,'phone','Phone / WhatsApp','tel')}${fld(obj,'website','Website','url','autocapitalize="off"')}</div><div class="group">${ta(obj,'goal','Long-term goal')}</div>`}
else if(kind==='daily'){title='Daily checklist';body=`<p class="sec">Everyday tasks</p><div class="group">${taskRows(S.daily.tasks,'daily')}</div><div class="group">${fld(S.goals,'emailsGoal','Outreach emails per day','number','inputmode="numeric"')}</div><p class="note" style="margin-top:-14px">Ticks reset every morning. Changes here apply from today.</p>`}
else if(kind==='goals'){title='Goals';body=`<div class="group">${fld(obj,'clients','Paying clients now','number','inputmode="numeric"')}${fld(obj,'target','Client target','number','inputmode="numeric"')}${fld(obj,'fee','Average monthly fee (₹)','number','inputmode="numeric"')}${fld(obj,'emailsGoal','Outreach emails per day','number','inputmode="numeric"')}</div>`}
sh.innerHTML=`<div class="scrim" data-x="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="shandle"><div class="grab"></div><header class="sbar"><span></span><strong>${esc(title)}</strong><button class="nb b" data-x="close">Done</button></header></div><div class="sbody">${body}</div></section>`;
if(keep){const b=sh.querySelector('.sbody');if(b)b.scrollTop=sc}}
function openSheet(kind,obj,isNew){sheet={kind,obj,isNew:!!isNew};renderSheet();history.pushState({gsm:1},'')}
function finishSheet(){if(!sheet)return;const {kind,obj,isNew}=sheet;
if(isNew){const empty=kind==='link'?!obj.title&&!obj.url:kind==='note'?!obj.title&&!obj.body:kind==='plan'?!obj.title&&!obj.tasks.length:false;if(empty){const arr=kind==='link'?S.links:kind==='note'?S.notes:S.plans;const i=arr.indexOf(obj);if(i>=0)arr.splice(i,1)}}
if(kind==='link'&&obj.url&&!/^[a-z]+:/i.test(obj.url))obj.url='https://'+obj.url.trim();
save();sheet=null;renderSheet();render()}
function closeSheet(){finishSheet();if(history.state&&history.state.gsm)history.back()}
function taskList(){return sheet.kind==='daily'?S.daily.tasks:sheet.obj.tasks}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-nav],[data-new],[data-open],[data-plan],[data-note],[data-link],[data-daily],[data-em],[data-cl],[data-tc],[data-tdel],[data-x]');if(!el)return;const d=el.dataset;
if(d.nav){view=d.nav;q='';render();window.scrollTo(0,0);return}
if(d.new){let o;if(d.new==='link'){o={id:uid(),title:'',url:'',group:'Other',note:'',fav:false};S.links.push(o)}else if(d.new==='note'){o={id:uid(),title:'',body:'',pin:false,ts:Date.now()};S.notes.unshift(o)}else{o={id:uid(),title:'',sub:'',start:'',end:'',notes:'',tasks:[]};S.plans.push(o)}openSheet(d.new,o,true);return}
if(d.open){openSheet(d.open,d.open==='profile'?S.profile:S.goals);return}
if(d.plan){const o=S.plans.find(x=>x.id===d.plan);if(o)openSheet('plan',o);return}
if(d.note){const o=S.notes.find(x=>x.id===d.note);if(o)openSheet('note',o);return}
if(d.link){e.preventDefault();const o=S.links.find(x=>x.id===d.link);if(o)openSheet('link',o);return}
if(d.daily){const lg=dayLog(),i=lg.done.indexOf(d.daily);if(i>=0)lg.done.splice(i,1);else lg.done.push(d.daily);save();render();return}
if(d.em){const lg=dayLog();lg.emails=Math.max(0,lg.emails+Number(d.em));save();render();return}
if(d.cl){S.goals.clients=Math.max(0,(Number(S.goals.clients)||0)+Number(d.cl));save();render();return}
if(d.tc&&sheet){const t=taskList().find(x=>x.id===d.tc);if(t){t.d=!t.d;save();renderSheet(true)}return}
if(d.tdel&&sheet){const arr=taskList(),i=arr.findIndex(x=>x.id===d.tdel);if(i>=0){arr.splice(i,1);save();renderSheet(true)}return}
const x=d.x;
if(x==='close'){closeSheet();return}
if(x==='addtask'){addTask();return}
if(x==='copy'){try{await navigator.clipboard.writeText(sheet.obj.url);toast('Link copied')}catch(_){toast('Could not copy',true)}return}
if(x==='share'){const o=sheet.obj;if(navigator.share){try{await navigator.share({title:o.title,url:o.url})}catch(_){}}else{try{await navigator.clipboard.writeText(o.url);toast('Link copied')}catch(_){}}return}
if(x==='delete'&&sheet){const {kind,obj}=sheet,arr=kind==='link'?S.links:kind==='note'?S.notes:S.plans;if(!confirm(`Delete this ${kind}?`))return;const i=arr.indexOf(obj);if(i>=0)arr.splice(i,1);sheet.isNew=false;save();sheet=null;renderSheet();render();if(history.state&&history.state.gsm)history.back();toast('Deleted');return}
if(x==='backup'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GS Master backup ${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Backup downloaded');return}
if(x==='reset'){if(!confirm('Reset everything to the starting data? Your own notes and changes will be lost.'))return;S=defaults();save();render();toast('Reset done');return}});
function addTask(){const inp=$('newtask');if(!inp||!sheet)return;const v=inp.value.trim();if(!v){inp.focus();return}const t={id:uid(),t:v};if(sheet.kind==='plan')t.d=false;taskList().push(t);save();renderSheet(true);const n=$('newtask');if(n)n.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){closeSheet();return}if(e.key==='Enter'&&e.target.id==='newtask'){e.preventDefault();addTask();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='q'){q=el.value;const l=$('list');if(l)l.innerHTML=view==='links'?linksList():notesList();return}
if(!sheet)return;
if(el.dataset.tt){const t=taskList().find(x=>x.id===el.dataset.tt);if(t){t.t=el.value;save()}return}
const k=el.dataset.f;if(!k)return;const o=sheet.kind==='daily'?S.goals:sheet.obj;
o[k]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?0:Number(el.value)):el.value;if(sheet.kind==='note')o.ts=Date.now();save()});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='restore'&&el.files[0]){try{const d=JSON.parse(await el.files[0].text());if(!d||!d.v||!Array.isArray(d.links)||!Array.isArray(d.notes))throw new Error('This is not a GS Master backup');if(confirm('Replace everything on this device with this backup?')){S=d;save();render();toast('Backup restored')}}catch(err){toast(err.message,true)}el.value='';return}
if(sheet&&el.dataset.f&&el.type==='checkbox'){const o=sheet.kind==='daily'?S.goals:sheet.obj;o[el.dataset.f]=el.checked;save()}});
sh.addEventListener('touchstart',e=>{const s=e.target.closest('.sheet');if(!s)return;const onHandle=!!e.target.closest('.shandle'),b=s.querySelector('.sbody');if(!onHandle&&(b.scrollTop>0||e.target.closest('input,textarea,select')))return;drag={y:e.touches[0].clientY,s,dy:0}},{passive:true});
sh.addEventListener('touchmove',e=>{if(!drag)return;drag.dy=Math.max(0,e.touches[0].clientY-drag.y);drag.s.style.transition='none';drag.s.style.transform=drag.dy?`translateY(${drag.dy}px)`:''},{passive:true});
sh.addEventListener('touchend',()=>{if(!drag)return;const {s,dy}=drag;drag=null;s.style.transition='transform .22s ease';if(dy>120){s.style.transform='translateY(100%)';setTimeout(closeSheet,200)}else s.style.transform=''});
addEventListener('popstate',()=>{if(sheet)finishSheet()});
addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>30),{passive:true});
save();render();
})();
</script>
</body>
</html>
