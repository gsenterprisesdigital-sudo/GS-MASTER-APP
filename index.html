const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/,URL_RE=/^https?:\/\/\S+$/i;

function dateLocal(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateAdd(n){const d=new Date();d.setDate(d.getDate()+Number(n||4));return dateLocal(d)}
const firstName=p=>(p.contact_name||'').trim().split(/\s+/)[0]||'';
function formatMessage(s,p){const f=firstName(p);const v={first_name:f?f+' ji':"Sir/Ma'am",business:p.business_name||'your business',city:p.city||'your city',industry:p.industry||'your industry',pitch:p.pitch_angle||'your business online',brand:BRAND,website:WEBSITE};

function parseCSV(t){const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

<p id="t-err" class="form-err"></p><div class="horizontal"><button class="button primary" data-act="tsave">Save template to Supabase</button>${t?'<button class="button red" data-act="tdel">Delete</button>':''}</div>
<div class="panel-divider"></div><label class="small-label">Preview</label><div class="template-preview" id="t-preview"><b>${esc(formatMessage(g('subject',t?.subject||''),sample))}</b>\n\n${esc(formatMessage(g('body',t?.body||''),sample))}</div></div></div>`}

function reportsPage(){const total=prospects.length;return `<div class="report-grid"><div class="card card-pad"><div class="section-heading"><div><h2>Email pipeline</h2><p>${total} prospects</p></div></div>${statuses.map(s=>{const n=prospects.filter(p=>p.status===s).length;return `<div class="stat-row"><span>${s}</span><b>${n}</b></div><div class="progress" style="height:6px"><span style="width:${total?n/total*100:0}%"></span></div>`}).join('')}</div>
<div style="display:grid;gap:14px;align-content:start"><div class="card card-pad"><h2 style="font-size:17px;margin:0 0 10px">Settings</h2><label class="small-label" for="s-days">Default follow-up after (days)</label><input class="field wide" type="number" id="s-days" min="1" max="60" value="${settings.default_followup_days||4}"><p class="muted" style="font-size:11px">Shared with your LinkedIn CRM.</p><button class="button primary" data-act="ssave">Save settings</button></div>
<div class="card card-pad"><h2 style="font-size:17px;margin:0 0 8px">Data</h2><div class="stat-row"><span>Total prospects</span><b>${total}</b></div><div class="stat-row"><span>Unsubscribed or bounced</span><b>${prospects.filter(p=>['Unsubscribed','Bounced'].includes(p.status)).length}</b></div><button class="button" data-act="export">Export CSV</button></div>
<div class="card card-pad"><h2 style="font-size:17px;margin:0 0 8px">Security</h2><p class="muted">Signing out here also signs you out of the LinkedIn CRM on this browser.</p><button class="button red" data-act="logout">Sign out</button></div></div></div>`}

function render(){if(!user)return renderLogin();
if(view==='outreach'){const list=filtered();if(!list.some(p=>p.id===selectedId)){selectedId=list[0]?.id||null;activities=[];activitiesFor=null;if(selectedId){const id=selectedId;setTimeout(()=>loadActivities(id),0)}}}
const pages={home:['Your email workspace','Find, email and follow up, one prospect at a time.',homePage],outreach:['Email outreach','Write here, send from Gmail, then mark sent.',outreachPage],add:['Add leads','Add one prospect or paste a CSV list.',addPage],templates:['Email templates','Edit once, reuse anywhere. Everything saves to Supabase.',templatePage],reports:['Reports and settings','See your pipeline and manage settings.',reportsPage]};
const [t,d,fn]=pages[view];app.innerHTML=shell(fn(),t,d)}

function selectP(id){selectedId=id;activities=[];activitiesFor=null;view='outreach';const p=selected();if(p&&!TABS[filter.status](p))filter.status='All';render();loadActivities(id);if(innerWidth<800)$('detail')?.scrollIntoView({behavior:'smooth'})}
async function loadActivities(id){const {data,error}=await sb.from('email_activities').select('event_type,subject,body,occurred_at').eq('prospect_id',id).order('occurred_at',{ascending:false}).limit(30);if(selectedId!==id)return;activities=error?[]:(data||[]);activitiesFor=id;const h=$('hist');if(h)h.innerHTML=histHtml();if(error)toast('History unavailable: '+error.message,true)}
async function copyText(s){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(s);const el=document.createElement('textarea');el.value=s;el.style.cssText='position:fixed;left:-10000px';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw new Error('Copy is unavailable in this browser')}
function openGmail(){const p=selected();if(!p)return;if(!subj[p.id]?.trim()||!body[p.id]?.trim())return toast('Write a subject and message first.',true);window.open(gmailUrl(p.email,subj[p.id],body[p.id]),'_blank','noopener');toast('Send it in Gmail, then tap Mark sent.')}
function openThread(){const p=selected();if(p)window.open(`${gmailBase}#search/${encodeURIComponent('to:'+p.email)}`,'_blank','noopener')}
async function copyEmail(){const p=selected();if(!p)return;try{await copyText(body[p.id]||'');toast('Message copied')}catch(e){toast('Could not copy: '+e.message,true)}}
function openSource(){const u=selected()?.source_url||'';if(!URL_RE.test(u))return toast('Source URL looks invalid.',true);window.open(u,'_blank','noopener')}
function nextProspect(){const list=filtered(),i=list.findIndex(x=>x.id===selectedId),n=list[i+1]||list.find(x=>x.id!==selectedId);if(!n)return toast('No other prospect in this view.');selectP(n.id)}

async function markSent(){const p=selected();if(!p)return;const st=stageFor(p);if(!st||STOP.includes(p.status))return;const b=document.querySelector('[data-act="sent"]');if(b)b.disabled=true;
const patch={status:NEXT[st],last_touch:dateLocal(),next_followup:st==='follow_up_2'?null:dateAdd(settings.default_followup_days||4)};
try{const {data,error}=await sb.from('email_prospects').update(patch).eq('id',p.id).eq('user_id',user.id).select().single();if(error)throw error;
const log=await sb.from('email_activities').insert({user_id:user.id,prospect_id:p.id,event_type:'sent_'+st,subject:subj[p.id]||null,body:body[p.id]||null});
todayLog.push({event_type:'sent_'+st});delete subj[p.id];delete body[p.id];delete chosen[p.id];
const idx=filtered().findIndex(x=>x.id===p.id);replaceP(data);const after=filtered();
if(!after.some(x=>x.id===p.id))selectedId=after[Math.min(Math.max(idx,0),after.length-1)]?.id||null;
activities=[];activitiesFor=null;render();if(selectedId)loadActivities(selectedId);
if(log.error)toast('Marked sent, but history failed: '+log.error.message,true);else toast(`${NEXT[st]} ✓${patch.next_followup?' · follow-up on '+patch.next_followup:''}`)}
catch(e){toast('Could not mark sent: '+e.message,true);if(b)b.disabled=false}}

async function saveCRM(){const p=selected();if(!p)return;const patch={status:val('c-status'),next_followup:val('c-next')||null,notes:$('c-notes').value};
try{const {data,error}=await sb.from('email_prospects').update(patch).eq('id',p.id).eq('user_id',user.id).select().single();if(error)throw error;
if(p.status!==data.status){const r=await sb.from('email_activities').insert({user_id:user.id,prospect_id:p.id,event_type:'status_change',body:`Status: ${p.status} → ${data.status}`});if(r.error)toast('Saved, but history failed: '+r.error.message,true);delete subj[p.id];delete body[p.id];delete chosen[p.id]}
replaceP(data);['c-status','c-next','c-notes'].forEach(k=>delete keep[k+':'+p.id]);activities=[];activitiesFor=null;render();loadActivities(p.id);toast('Saved to Supabase ✓')}
catch(e){toast('Save failed: '+e.message,true)}}

async function addProspect(){const r={user_id:user.id,business_name:val('f-business'),contact_name:val('f-contact')||null,email:val('f-email').toLowerCase(),source_url:val('f-url'),industry:val('f-industry')||null,city:val('f-city')||null,pitch_angle:val('f-pitch')||null};
const er=$('f-err'),bad=validRow(r);if(bad){er.textContent=bad;return}if(prospects.some(p=>p.email===r.email)){er.textContent='This email is already in your list.';return}
const b=document.querySelector('[data-act="add"]');b.disabled=true;const {data,error}=await sb.from('email_prospects').insert(r).select().single();
if(error){b.disabled=false;er.textContent=error.code==='23505'?'This email is already in your list.':error.message;return}
prospects.unshift(data);Object.keys(keep).filter(k=>k.startsWith('f-')).forEach(k=>delete keep[k]);render();$('f-business')?.focus();toast(`Added ${data.business_name} ✓ · ${prospects.filter(TABS['To send']).length} waiting to email`)}

async function importCSV(){const er=$('i-err'),rows=parseCSV($('i-text').value);if(!rows.length){er.textContent='Paste at least one line.';return}if(/business/i.test(rows[0][0]||''))rows.shift();
const seen=new Set(prospects.map(p=>p.email)),good=[];let bad=0,dup=0;
for(const c of rows){const g=i=>(c[i]||'').trim();const r={user_id:user.id,business_name:g(0),contact_name:g(1)||null,email:g(2).toLowerCase(),source_url:g(3),industry:g(4)||null,city:g(5)||null,pitch_angle:g(6)||null};if(validRow(r)){bad++;continue}if(seen.has(r.email)){dup++;continue}seen.add(r.email);good.push(r)}
if(!good.length){er.textContent=`Nothing new to import · ${dup} duplicates · ${bad} invalid rows.`;return}
const b=document.querySelector('[data-act="import"]');b.disabled=true;
const {data,error}=await sb.from('email_prospects').upsert(good,{onConflict:'user_id,email',ignoreDuplicates:true}).select();
if(error){b.disabled=false;er.textContent=error.message;return}
const added=data||[];prospects=[...added,...prospects];delete keep['i-text'];render();toast(`${added.length} imported · ${dup+good.length-added.length} duplicates · ${bad} invalid skipped`)}

async function saveTemplate(){const k=templateEditId||'new',er=$('t-err');const row={name:val('t-name'),stage:val('t-stage'),subject:val('t-subject'),body:$('t-body').value.trim()};
if(!row.name||!row.subject||!row.body){er.textContent='Name, subject and message are required.';return}
try{const res=templateEditId?await sb.from('email_templates').update(row).eq('id',templateEditId).eq('user_id',user.id).select().single():await sb.from('email_templates').insert({...row,user_id:user.id}).select().single();if(res.error)throw res.error;
templates=templateEditId?templates.map(t=>t.id===res.data.id?res.data:t):[...templates,res.data];Object.keys(keep).filter(x=>x.startsWith('t-')&&x.endsWith(':'+k)).forEach(x=>delete keep[x]);
templateEditId=res.data.id;subj={};body={};chosen={};render();toast('Template saved to Supabase ✓')}catch(e){er.textContent=e.message}}
async function deleteTemplate(){if(!templateEditId||!confirm('Delete this template? Sent email history stays intact.'))return;const {error}=await sb.from('email_templates').delete().eq('id',templateEditId).eq('user_id',user.id);if(error)return toast(error.message,true);templates=templates.filter(t=>t.id!==templateEditId);templateEditId=null;subj={};body={};chosen={};render();toast('Template deleted')}
async function saveSettings(){const d=Number(val('s-days'));if(!Number.isInteger(d)||d<1||d>60)return toast('Follow-up days must be between 1 and 60',true);const {data,error}=await sb.from('crm_settings').upsert({user_id:user.id,default_followup_days:d},{onConflict:'user_id'}).select().single();if(error)return toast(error.message,true);settings={...settings,...data};render();toast('Settings saved ✓')}
function exportCsv(){const fields=['business_name','contact_name','email','source_url','industry','city','pitch_angle','status','last_touch','next_followup','notes'];const csv='\ufeff'+fields.join(',')+'\r\n'+prospects.map(r=>fields.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='GS_Gmail_Prospects_'+dateLocal()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('CSV export downloaded')}
async function logout(){const {error}=await sb.auth.signOut();if(error)return toast(error.message,true);user=null;renderLogin()}

async function fetchProspects(){let all=[];for(let s=0;s<20000;s+=1000){const {data,error}=await sb.from('email_prospects').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).range(s,s+999);if(error)throw error;all.push(...(data||[]));if((data||[]).length<1000)break}return all}
async function loadData(force=false){if(loading)return;loading=true;try{const start=new Date();start.setHours(0,0,0,0);
const [ps,tm,lg,st]=await Promise.all([fetchProspects(),sb.from('email_templates').select('*').eq('user_id',user.id),sb.from('email_activities').select('event_type').eq('user_id',user.id).like('event_type','sent_%').gte('occurred_at',start.toISOString()),sb.from('crm_settings').select('*').eq('user_id',user.id).maybeSingle()]);
if(tm.error)throw new Error('Templates table not ready: '+tm.error.message);if(lg.error)throw new Error('Activities table not ready: '+lg.error.message);
prospects=ps;templates=tm.data||[];todayLog=lg.data||[];if(!st.error&&st.data)settings={...settings,...st.data};
if(!templates.length){const {data,error}=await sb.from('email_templates').insert(DEFAULTS.map(t=>({...t,user_id:user.id}))).select();if(error)throw error;templates=data||[]}
if(force){subj={};body={};chosen={};toast('Data refreshed from Supabase')}render();if(selectedId&&view==='outreach')loadActivities(selectedId)}
catch(e){app.innerHTML=`<div class="card card-pad main-error"><h2>Could not load Gmail outreach</h2><p class="error">${esc(e.message)}</p><p>Run the Gmail outreach SQL in Supabase first, then retry. Your LinkedIn contacts are not affected.</p><button class="button primary" data-act="refresh">Retry</button> <button class="button" data-act="logout">Sign out</button></div>`}finally{loading=false}}

function renderLogin(){app.innerHTML=`<div class="card center-card"><div class="logo" style="padding:0"><span class="logo-icon">GS</span><span><strong>GS Enterprises Digital</strong><small>PRIVATE GMAIL OUTREACH</small></span></div><h1>Unlock Gmail outreach</h1><p>Use the same Supabase account as your LinkedIn CRM. If you're already signed in there on this browser, you won't see this screen.</p><form id="login-form"><div><label class="small-label" for="email">Your Supabase Auth email</label><input class="field wide" type="email" autocomplete="username" id="email" required></div><div><label class="small-label" for="password">Password</label><input class="field wide" type="password" autocomplete="current-password" id="password" required></div><button class="button primary" type="submit" id="login-btn">Sign in securely</button></form><p class="notice" style="margin-top:16px">Do not paste a secret or service_role key into this website.</p></div>`}

const ACT={refresh:()=>loadData(true),gmail:openGmail,copy:copyEmail,thread:openThread,sent:markSent,save:saveCRM,source:openSource,next:nextProspect,add:addProspect,import:importCSV,tnew:()=>{templateEditId=null;render()},tsave:saveTemplate,tdel:deleteTemplate,ssave:saveSettings,export:exportCsv,logout:logout};
app.addEventListener('click',e=>{const el=e.target.closest('[data-view],[data-sel],[data-tab],[data-go],[data-tpl],[data-act]');if(!el||el.disabled)return;const d=el.dataset;
if(d.view){view=d.view;render();window.scrollTo(0,0)}else if(d.sel)selectP(d.sel);else if(d.tab){filter.status=d.tab;render()}else if(d.go){filter.status=d.go;view='outreach';render()}else if(d.tpl){templateEditId=d.tpl;render()}else if(ACT[d.act])ACT[d.act]()});
function onField(e){const el=e.target;
if(el.id==='q'){if(e.type!=='input')return;filter.q=el.value;const pos=el.selectionStart;render();const n=$('q');n?.focus();n?.setSelectionRange(pos,pos);return}
if(el.dataset.keep)keep[el.dataset.keep]=el.value;if(el.id==='t-subject'||el.id==='t-body')updatePreview();
const p=selected();if(!p)return;
if(el.id==='m-subj')subj[p.id]=el.value;else if(el.id==='m-body')body[p.id]=el.value;
else if(el.id==='m-tpl'&&e.type==='change'){chosen[p.id]=el.value;const t=templates.find(x=>x.id===el.value);if(t){subj[p.id]=formatMessage(t.subject,p);body[p.id]=formatMessage(t.body,p)}render()}}
app.addEventListener('input',onField);app.addEventListener('change',onField);
app.addEventListener('submit',async e=>{if(e.target.id!=='login-form')return;e.preventDefault();const b=$('login-btn');b.disabled=true;b.textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email:val('email'),password:$('password').value});if(error){toast(error.message,true);b.disabled=false;b.textContent='Sign in securely';return}user=data.user;await loadData()});

async function boot(){if(!window.supabase?.createClient){app.innerHTML='<div class="card card-pad main-error"><h2>Internet connection required</h2><p>Supabase library could not load. Check your connection and refresh.</p></div>';return}
sb=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const {data,error}=await sb.auth.getUser();if(error||!data?.user){renderLogin();return}user=data.user;await loadData()}
boot();
</script></body></html>
