const {tot,sc}=scorer(),inM=v=>String(v||'').slice(0,7)===m,L=x=>S.log[x]||{done:[],emails:0},wins=items('win').filter(x=>inM(x.data.date)).sort(K.win.sort);
const st=[[days.filter(x=>sc(x)>0).length,'Active days'],[days.filter(x=>sc(x)>=tot).length,'Perfect days'],[days.reduce((s,x)=>s+L(x).done.length,0),'Tasks ticked'],[days.reduce((s,x)=>s+L(x).emails,0),'Outreach emails'],[items('content').filter(x=>x.data.done&&inM(x.data.date)).length,'Content posted'],[S.tasks.filter(x=>x.done&&inM(x.updated_at)).length,'Plan tasks finished'],[items('idea').filter(x=>inM(x.created_at)).length,'Ideas added'],[wins.length,'Wins']];
t='Monthly report';b=`<div class="ph" style="margin-bottom:16px"><button class="act" data-mo="-1">‹ Prev</button><b>${MO[Mo-1]} ${Y}</b><button class="act" data-mo="1">Next ›</button></div><div class="stats">${st.map(([n,l])=>`<div class="st"><b>${n}</b><span>${l}</span></div>`).join('')}</div>${wins.length?sec('Wins')+`<div class="group">${wins.map(x=>`<div class="row"><span class="rc"><span class="t w">🏆 ${E(x.data.text)}</span><span class="s">${nd(x.data.date)}</span></span></div>`).join('')}</div>`:''}<button class="act" style="width:100%" data-x="csv">Download (.csv)</button>`}
else{t='Goals';b=`<div class="group">${F(o,'target','Client target','number')}${F(o,'emails','Outreach emails per day','number')}</div><p class="m">Active clients and revenue come from the Clients tab.</p>`}
sh.innerHTML=`<div class="scrim" data-x="close"></div><section class="sheet"><div class="sbar"><b>${t}</b><button data-x="close">Done</button></div><div class="sbody">${b}</div></section>`;if(keep)sh.querySelector('.sbody').scrollTop=y}
function openS(k,o,isNew){if(!o)return;sheet={k,o,isNew};rs();history.pushState({s:1},'')}
const arrOf=k=>k==='link'?S.links:k==='note'?S.notes:k==='plan'?S.plans:S.items,tabOf=k=>k==='link'?T.li:k==='note'?T.no:k==='plan'?T.pl:T.it;
function fin(){if(!sheet)return;const {k,o,isNew}=sheet;if(k==='link'&&o.url&&!/^[a-z]+:/i.test(o.url)){o.url='https://'+o.url.trim();put(T.li,o,0)}
const empty=k==='link'?!o.title&&!o.url:k==='note'?!o.title&&!o.body:k==='plan'?!o.title&&!tk(o.id).length:k==='item'?!Object.entries(o.data).some(([a,v])=>v&&v!==K[o.kind].def()[a]):false;
if(isNew&&empty){const a=arrOf(k);a.splice(a.indexOf(o),1);drop(tabOf(k),o.id)}sheet=null;rs();render()}
function closeS(){fin();if(history.state&&history.state.s)history.back()}
function tgt(){return sheet.k==='daily'||sheet.k==='goals'?S.goals:sheet.k==='item'?sheet.o.data:sheet.o}
function sv(){const {k,o}=sheet;if(k==='link')put(T.li,o);else if(k==='plan')put(T.pl,o);else if(k==='item')put(T.it,o);else if(k==='note'){o.updated_at=new Date().toISOString();put(T.no,o)}else if(k==='profile')put(T.st,{key:'profile',value:S.profile});else if(k==='reminder')put(T.st,{key:'reminder',value:S.rem});else if(k!=='report')put(T.st,{key:'goals',value:S.goals})}
function togLog(id){const l=lgT(),i=l.done.indexOf(id);if(i<0)l.done.push(id);else l.done.splice(i,1);put(T.lg,l,300)}
function move(list,o,dir,table){list=list.slice().sort(so);const i=list.indexOf(o),j=i+dir;if(i<0||j<0||j>=list.length)return;if(list.some((x,n)=>n&&x.sort===list[n-1].sort))list.forEach((x,n)=>{x.sort=n+1;put(table,x,0)});const a=list[i],b=list[j],s=a.sort;a.sort=b.sort;b.sort=s;put(table,a,0);put(table,b,0)}
async function addT(){const i=$('nt'),v=i&&i.value.trim();if(!v)return;let t;if(sheet.k==='plan'){if(sheet.ready)await sheet.ready;t={id:uid(),plan_id:sheet.o.id,title:v,done:false,sort:Date.now()};S.tasks.push(t);put(T.ta,t,0)}else{t={id:uid(),title:v,sort:Date.now()};S.daily.push(t);put(T.da,t,0)}rs(1);$('nt').focus()}
function quick(id,kind,mk){const i=$(id),v=i&&i.value.trim();if(!v)return;const o={id:uid(),kind,data:mk(v),sort:Date.now(),created_at:new Date().toISOString()};S.items.push(o);put(T.it,o,0);render();toast('Saved')}
function newObj(k){if(k==='link')return {id:uid(),title:'',url:'',grp:'Other',note:'',fav:false,sort:Date.now()};if(k==='note')return {id:uid(),title:'',body:'',pinned:false,updated_at:new Date().toISOString()};if(k==='plan')return {id:uid(),title:'',sub:'',start_date:null,end_date:null,notes:'',sort:Date.now()};return {id:uid(),kind:k,data:K[k].def(),sort:Date.now(),created_at:new Date().toISOString()}}
function ics(){const [hh,mm]=(S.rem.time||'11:00').split(':'),d=addD(day(),1).replace(/-/g,''),url=location.href.split(/[?#]/)[0];dl(['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GS Master//EN','BEGIN:VEVENT','UID:'+uid()+'@gsmaster','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;TZID=Asia/Kolkata:'+d+'T'+hh+mm+'00','DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:GS Master · daily tasks','DESCRIPTION:Open '+url,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:GS Master daily tasks','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),'GS Master reminder.ics','text/calendar')}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-nav],[data-new],[data-open],[data-plan],[data-note],[data-link],[data-item],[data-day],[data-em],[data-tc],[data-td],[data-ctog],[data-lib],[data-mon],[data-mv],[data-mvo],[data-mo],[data-x]');if(!el)return;const d=el.dataset;
if(d.nav){view=d.nav;q='';render();scrollTo(0,0)}
else if(d.lib){lib=d.lib;view='library';q='';render()}
else if(d.mon){mon=d.mon;q='';render()}
else if(d.new){const o=newObj(d.new),k=K[d.new]?'item':d.new;arrOf(k).push(o);openS(k,o,1);if(d.new==='plan')sheet.ready=send(T.pl,o)}
else if(d.open)openS(d.open,d.open==='profile'?S.profile:d.open==='reminder'?S.rem:d.open==='report'?{m:day().slice(0,7)}:S.goals);
else if(d.plan)openS('plan',S.plans.find(x=>x.id===d.plan));
else if(d.note)openS('note',S.notes.find(x=>x.id===d.note));
else if(d.item)openS('item',S.items.find(x=>x.id===d.item));
else if(d.link){e.preventDefault();openS('link',S.links.find(x=>x.id===d.link))}
else if(d.day){togLog(d.day);render()}
else if(d.em){const l=lgT();l.emails=Math.max(0,l.emails+Number(d.em));put(T.lg,l,400);render()}
else if(d.ctog){const x=S.items.find(i=>i.id===d.ctog);if(x){x.data.done=!x.data.done;put(T.it,x,0);render()}}
else if(d.tc){const t=S.tasks.find(x=>x.id===d.tc);if(t){if(isRep(pOf(t)))togLog(t.id);else{t.done=!t.done;put(T.ta,t,0)}sheet?rs(1):render()}}
else if(d.td){const a=sheet.k==='daily'?S.daily:S.tasks,i=a.findIndex(x=>x.id===d.td);if(i>=0){a.splice(i,1);drop(sheet.k==='daily'?T.da:T.ta,d.td);rs(1)}}
else if(d.mv){const daily=sheet.k==='daily',o=(daily?S.daily:S.tasks).find(x=>x.id===d.mv);move(daily?S.daily:tk(sheet.o.id),o,Number(d.dir),daily?T.da:T.ta);rs(1)}
else if(d.mvo){const o=sheet.o;move(sheet.k==='link'?S.links.filter(x=>(x.grp||'Other')===(o.grp||'Other')):S.plans,o,Number(d.mvo),sheet.k==='link'?T.li:T.pl);toast('Moved')}
else if(d.mo){const [y,m]=sheet.o.m.split('-').map(Number);sheet.o.m=new Date(Date.UTC(y,m-1+Number(d.mo),1)).toISOString().slice(0,7);rs()}
else{const x=d.x;
if(x==='close')closeS();else if(x==='addt')addT();else if(x==='ro'){sheet.ro=!sheet.ro;rs(1)}
else if(x==='addidea')quick('idea','idea',v=>({text:v}));else if(x==='addwin')quick('win','win',v=>({text:v,date:day()}));
else if(x==='copy'||x==='copyt'){const o=sheet.o,txt=x==='copy'?o.url:[o.data.subject?'Subject: '+o.data.subject:'',o.data.body||''].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(_){toast('Could not copy',true)}}
else if(x==='del'){const {k,o}=sheet;if(!confirm('Delete this?'))return;const a=arrOf(k);a.splice(a.indexOf(o),1);if(k==='plan'){S.tasks=S.tasks.filter(t=>t.plan_id!==o.id);if(isRep(o)){S.rep=S.rep.filter(i=>i!==o.id);put(T.st,{key:'repeat',value:{ids:S.rep}},0)}}drop(tabOf(k),o.id);sheet=null;rs();render();if(history.state&&history.state.s)history.back();toast('Deleted')}
else if(x==='refresh'){flush();try{await load(1);render();toast('Up to date')}catch(err){toast(err.message,true)}}
else if(x==='backup')dl(JSON.stringify(S,null,2),'GS Master backup '+day()+'.json','application/json');
else if(x==='ics')ics();
else if(x==='csv'){const m=sheet.o.m,r=['Date,Tasks ticked,Outreach emails'];Object.keys(S.log).filter(k=>k.startsWith(m)).sort().forEach(k=>r.push(`${k},${S.log[k].done.length},${S.log[k].emails}`));dl(r.join('\n'),'GS Master '+m+'.csv','text/csv')}
else if(x==='retry')boot()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='q'){q=el.value;const l=$('list');if(l)l.innerHTML=view==='clients'?ilist(mon):libList();return}
if(el.id==='gq'){$('gres').innerHTML=gsearch(el.value);return}
if(!sheet||el.type==='checkbox'||el.tagName==='SELECT'||el.dataset.due)return;
if(el.dataset.tt){const t=(sheet.k==='daily'?S.daily:S.tasks).find(x=>x.id===el.dataset.tt);if(t){t.title=el.value;put(sheet.k==='daily'?T.da:T.ta,t)}return}
const k=el.dataset.f;if(!k)return;tgt()[k]=el.type==='number'?(Number(el.value)||0):el.type==='date'?(el.value||null):el.value;sv()});
document.addEventListener('change',e=>{const el=e.target;if(!sheet)return;
if(el.dataset.due){const t=S.tasks.find(x=>x.id===el.dataset.due);if(t){t.due=el.value||null;put(T.ta,t,0);rs(1)}return}
if(el.dataset.hide){const h=el.dataset.hide;S.hide=el.checked?S.hide.filter(x=>x!==h):[...S.hide,h];put(T.st,{key:'home',value:{hide:S.hide}},0);return}
if(el.dataset.rep){const id=sheet.o.id;S.rep=el.checked?[...new Set([...S.rep,id])]:S.rep.filter(x=>x!==id);put(T.st,{key:'repeat',value:{ids:S.rep}},0);rs(1);toast(el.checked?'Tasks will show every day':'Repeat turned off');return}
if(!el.dataset.f)return;tgt()[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;sv();if(sheet.k==='reminder')rs(1)});
document.addEventListener('keydown',e=>{const id=e.target.id;if(e.key==='Enter'&&['nt','idea','win'].includes(id)){e.preventDefault();id==='nt'?addT():id==='idea'?quick('idea','idea',v=>({text:v})):quick('win','win',v=>({text:v,date:day()}))}if(e.key==='Escape'&&sheet)closeS()});
addEventListener('popstate',()=>{if(sheet)fin()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else if(S&&!sheet)render()});
async function boot(){app.innerHTML='<p class="empty">Loading…</p>';try{if(!sb)throw new Error('offline');await load();render()}catch(err){const c=localStorage.getItem('gsm_cache');if(c){S=JSON.parse(c);render();toast('Offline · showing saved copy',true)}else app.innerHTML=`<div class="empty"><b>Couldn't load</b><p>${E(/schema cache|does not exist|Could not find/i.test(err.message)?'Run the SQL setup in Supabase first.':err.message)}</p><button class="act" data-x="retry">Try again</button></div>`}}
boot();
})();
