svg.ic{width:22px;height:22px;flex:none}
.top{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding-top:env(safe-area-inset-top)}

.search .ic{width:17px;height:17px}

.note{font-size:13px;color:var(--sec);margin:0 16px 22px}
.pick{border:0;background:none;color:var(--blue);font-size:15px;max-width:55%;text-align:right}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;animation:fa .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 12px);z-index:21;max-width:680px;margin:0 auto;background:var(--bg);border-radius:12px 12px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .35s cubic-bezier(.2,.9,.25,1)}

.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 12px;background:var(--bar);border-bottom:.5px solid var(--sep)}
.sbar strong{font-weight:600}.sbar .nb:last-child{justify-self:end}
.sbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{text-align:center;display:grid;justify-items:center;gap:6px;margin-bottom:16px}
.hero h2{margin:6px 0 0;font-size:24px;font-weight:600}.hero p{margin:0;color:var(--sec);font-size:15px}.hero .meta{font-size:13px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.act{display:block;background:var(--card);border-radius:12px;padding:12px 6px;text-align:center;color:var(--blue);font-size:15px;font-weight:500;text-decoration:none}
.act.prim{background:var(--blue);color:#fff}.act.danger{color:var(--red)}.act.off{opacity:.35;pointer-events:none}
.gap{height:12px}
.f{display:block;padding:9px 16px;position:relative}
.f+.f::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.f small{display:block;font-size:13px;color:var(--sec);margin-bottom:2px}
.f input,.f select,.f textarea{width:100%;border:0;background:none;outline:none;padding:2px 0;font-size:17px;min-height:24px;-webkit-appearance:none;appearance:none;text-align:left;color:var(--text)}
.f input::-webkit-date-and-time-value{text-align:left}
.f textarea{min-height:70px;resize:vertical}
.f select{color:var(--blue)}
.f.bold input{font-weight:600}
.x{color:var(--sec);font-size:24px;padding:0 4px;line-height:1}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;z-index:40;background:var(--card);padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:.3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{color:var(--red)}
@keyframes up{from{transform:translateY(100%)}}@keyframes fa{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const er=[...emails].sort((a,b)=>tms(a.sent_at)-tms(b.sent_at)).map(e=>{const c=byId.get(e.contact_id)||{};return {'ID':c.contact_code||'','Name':c.name||'','Type':c.type||'','Sent on':xTs(e.sent_at),'Email type':e.kind||'','To':e.to_email||'','Subject':e.subject||'','Gmail thread link':e.gmail_thread||''}});
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cr,{header:Object.values(LBL)}),'Contacts');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(er,{header:EH}),'Emails');XLSX.writeFile(wb,`GS Contacts ${today()}.xlsx`);toast('Excel downloaded')}

async function fetchAll(t){let all=[];for(let s=0;;s+=1000){const {data:d,error}=await sb.from(t).select('*').order('id').range(s,s+999);if(error)throw error;all.push(...d);if(d.length<1000)return all}}
async function boot(){if(!window.supabase?.createClient){app.innerHTML='<div class="empty"><b>No connection</b>Connect to the internet and refresh.</div>';return}
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});app.innerHTML='<div class="empty">Loading…</div>';
try{[contacts,emails]=await Promise.all([fetchAll('gs_contacts'),fetchAll('gs_emails')]);render()}catch(e){app.innerHTML=`<div class="empty"><b>Couldn't load your database</b>${esc(/does not exist|schema cache/i.test(e.message)?'Run the SQL setup in Supabase first.':e.message)}<br><br><button class="btn" data-x="retry">Try again</button></div>`}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-x],[data-open],[data-seg],[data-flt],[data-eflt],[data-delmail]');if(!el||el.disabled)return;const d=el.dataset;
if(d.nav){view=d.nav;q='';limit=150;render();window.scrollTo(0,0)}
else if(d.open){const c=contacts.find(x=>String(x.id)===d.open);if(c){sheet={draft:{...c}};renderSheet()}}
else if(d.seg){seg=d.seg;limit=150;render()}
else if(d.flt){flt=d.flt;limit=150;render()}
else if(d.eflt){eflt=d.eflt;limit=150;render()}
else if(d.delmail)delMail(Number(d.delmail));
else ({new:()=>{sheet={draft:{type:seg==='Creators'?'Creator':'Business',status:'Not contacted'}};renderSheet()},close:closeSheet,save:()=>saveContact(false),delete:delContact,
logopen:()=>{const r=sheet.draft;sheet.log={at:new Date().toISOString(),kind:r.emails_sent?'Follow-up':'First email',subject:r.emails_sent&&r.subject?'Re: '+r.subject:(r.subject||'')};renderSheet()},
logcancel:()=>{sheet.log=null;renderSheet()},logsave:logSave,replied:()=>setStatus('Replied'),bounced:()=>setStatus('Bounced'),
template:downloadTemplate,export:exportXlsx,doimport:doImport,cancelimport:()=>{plan=null;render()},more:()=>{limit+=150;$('list').innerHTML=view==='emails'?emailList():contactList()},retry:boot}[d.x]||(()=>{}))()});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;q=e.target.value;limit=150;const l=$('list');if(l)l.innerHTML=view==='emails'?emailList():contactList()});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='file'&&el.files[0]){onFile(el.files[0]);el.value=''}else if(el.dataset.pick!==undefined&&plan)plan.sheets[+el.dataset.pick].role=el.value});
sh.addEventListener('input',onDraft);sh.addEventListener('change',onDraft);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
boot();
</script>
