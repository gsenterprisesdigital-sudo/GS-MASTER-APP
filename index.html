const CF=[['All',()=>true],['Not contacted',c=>c.status==='Not contacted'],['Follow-up due',due],['Waiting',c=>WAITING.includes(c.status)&&!due(c)],['Replied',c=>REPLIED.includes(c.status)],['Bounced',c=>c.status==='Bounced'],['Review',c=>c.status==='Needs review']];
const EF=[['All',()=>true],['Today',e=>ymd(new Date(e.sent_at))===today()],['Last 7 days',e=>ymd(new Date(e.sent_at))>=addDays(today(),-6)],['First emails',e=>!/follow/i.test(e.kind||'')],['Follow-ups',e=>/follow/i.test(e.kind||'')]];

return `<div class="row" role="button" tabindex="0" data-open="${c.id}"><span class="av ${c.type==='Creator'?'cr':''}">${esc(initials(c.name))}</span><span class="rc"><span class="t">${esc(c.name)}</span>${c.subject?`<span class="subj">${esc(c.subject)}</span>`:''}<span class="s">${esc(rowSub(c))}</span></span>${pill?`<button class="pill" data-qlog="${c.id}" aria-label="Log email sent to ${esc(c.name)}">Sent</button>`:badge(st)}</div>`}

function todayView(){const t=today(),n=emails.filter(e=>ymd(new Date(e.sent_at))===t).length,p=Math.min(1,n/DAILY_GOAL),h=istParts(new Date()).h;
const dueL=contacts.filter(due).sort((a,b)=>(a.next_follow_up||'').localeCompare(b.next_follow_up||''));

const next=contacts.filter(c=>c.status==='Not contacted'&&firstEmail(c)).sort((a,b)=>tms(a.created_at)-tms(b.created_at));
const day=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Kolkata'});
const body=section('Follow-ups due',dueL,'Follow-up due',true)+section('Replied · reply back',rep.slice(0,5))+section('Email next',next,'Not contacted',true);

function contactList(){const rows=contactsFiltered();if(!rows.length)return `<div class="empty"><b>${contacts.length?'Nothing here':'No contacts yet'}</b>${contacts.length?'Try another filter or search.':'Tap + to add one, or import your Excel from More.'}</div>`;

const rows=emails.filter(fn).filter(e=>{if(!s)return true;const c=byId.get(e.contact_id);return [e.subject,e.to_email,c?.name].some(v=>String(v||'').toLowerCase().includes(s))}).sort((a,b)=>tms(b.sent_at)-tms(a.sent_at));

$('tabbar').innerHTML=`<div class="tabbar-in">${[['today','Today',ICON.today],['contacts','Contacts',ICON.people],['emails','Emails',ICON.mail],['more','More',ICON.more]].map(([k,l,i])=>`<button class="tab ${view===k?'on':''}" data-nav="${k}" aria-label="${l}">${i}${k==='today'&&dueN?`<span class="dotn">${dueN}</span>`:''}<span>${l}</span></button>`).join('')}</div>`;

function logPanel(){const L=sheet.log,now=Date.now(),isNow=Math.abs(tms(L.at)-now)<6e4*5,isY=!isNow&&ymd(new Date(L.at))===addDays(today(),-1);

function renderSheet(){if(!sheet){sh.innerHTML='';document.body.classList.remove('lock');return}document.body.classList.add('lock');
const r=sheet.draft,isNew=!r.id,em=firstEmail(r),ph=digits(r.phone),thr=/^https?:/i.test(r.gmail_thread||'')?r.gmail_thread:'';
const mine=isNew?[]:emails.filter(e=>e.contact_id===r.id).sort((a,b)=>tms(b.sent_at)-tms(a.sent_at));

const meta=r.emails_sent?`${r.emails_sent} email${r.emails_sent>1?'s':''} sent · first ${niceDate(r.first_sent_at)} · last ${niceDate(r.last_sent_at)}`:'No emails sent yet';

${isNew?'':`<div class="hero"><span class="av big ${r.type==='Creator'?'cr':''}">${esc(initials(r.name))}</span><h2>${esc(r.name)}</h2><p>${esc(r.type)} · ${esc(r.contact_code)}</p>${badge(due(r)?'Follow-up due':r.status)}<p class="meta">${esc(meta)}</p></div>
<div class="cbtns">${cb(em&&gmailCompose(em,r.emails_sent&&r.subject?'Re: '+r.subject:(r.subject||'')),'Email',ICON.mail)}${cb(thr,'Thread',ICON.thread)}${cb(ph&&'https://wa.me/'+ph,'WhatsApp',ICON.wa)}${cb(ph&&'tel:+'+ph,'Call',ICON.phone)}${cb(em,'Copy',ICON.copy,'copy')}</div>
${sheet.log?logPanel():`<div class="two"><button class="btn" data-x="qlog" ${busy?'disabled':''}>I've sent an email</button><button class="btn g" data-x="logopen">Other date</button></div>`}

function openSheet(draft){sheet={draft};renderSheet();history.pushState({gsSheet:1},'')}

async function saveContact(keep){if(!sheet||busy)return;const d=sheet.draft,isNew=!d.id,name=String(d.name||'').trim();if(!name)return toast('Add a name first',true);
const row={};CCOLS.forEach(k=>{if(['contact_code','first_sent_at','last_sent_at','emails_sent'].includes(k))return;let v=d[k];if(typeof v==='string'){v=v.trim();if(!v)v=null}row[k]=v??null});
row.name=name;row.type=row.type||'Business';row.status=row.status||'Not contacted';row.updated_at=new Date().toISOString();
const em=firstEmail(row).toLowerCase(),dup=em&&contacts.find(c=>c.id!==d.id&&firstEmail(c).toLowerCase()===em);if(dup)return toast(`Already saved as ${dup.name} (${dup.contact_code})`,true);

busy=true;const b=sh.querySelector('[data-x="save"]');if(b)b.disabled=true;
const {data:res,error}=await (isNew?sb.from('gs_contacts').insert(row):sb.from('gs_contacts').update(row).eq('id',d.id)).select().single();busy=false;
if(error){if(b)b.disabled=false;return toast(error.message,true)}
replaceC(res);haptic();if(keep){sheet.draft={...res};sheet.dirty=false;renderSheet()}else dismiss();render();toast(isNew?'Contact added':'Saved')}
async function setStatus(s){if(!sheet)return;sheet.draft.status=s;await saveContact(true)}
async function logEmailFor(r,L,withUndo){if(busy||!r?.id)return;busy=true;const sent=L.at||new Date().toISOString(),subject=String(L.subject||'').trim()||null,to=firstEmail(r)||null;
const {data:e,error}=await sb.from('gs_emails').insert({contact_id:r.id,sent_at:sent,kind:L.kind,to_email:to,subject,gmail_thread:r.gmail_thread||null,import_key:'log:'+[(to||'').toLowerCase(),subject||'',kts(sent)].join('|')}).select().single();
if(error){busy=false;return toast(error.code==='23505'?'This email is already logged':error.message,true)}emails.push(e);
const cur=contacts.find(c=>c.id===r.id)||r;
const st=['Not contacted','Emailed','Follow-up sent','Needs review'].includes(cur.status)?(L.kind==='Follow-up'?'Follow-up sent':'Emailed'):cur.status;
const patch={emails_sent:(cur.emails_sent||0)+1,first_sent_at:cur.first_sent_at&&tms(cur.first_sent_at)<=tms(sent)?cur.first_sent_at:sent,last_sent_at:cur.last_sent_at&&tms(cur.last_sent_at)>=tms(sent)?cur.last_sent_at:sent,status:st,next_follow_up:addDays(ymd(new Date(sent)),L.kind==='Follow-up'?4:3),updated_at:new Date().toISOString()};
if(subject&&(!cur.subject||L.kind==='First email'))patch.subject=subject;
const prev={};Object.keys(patch).forEach(k=>prev[k]=cur[k]??null);
const {data:c,error:e2}=await sb.from('gs_contacts').update(patch).eq('id',r.id).select().single();busy=false;if(e2)return toast(e2.message,true);
replaceC(c);if(sheet&&sheet.draft.id===c.id){sheet.draft={...sheet.draft,...patch};sheet.log=null;renderSheet()}render();haptic();
toast(`Logged · ${c.name}`,{undo:withUndo?async()=>{await sb.from('gs_emails').delete().eq('id',e.id);emails=emails.filter(x=>x.id!==e.id);const {data:c2}=await sb.from('gs_contacts').update(prev).eq('id',c.id).select().single();if(c2){replaceC(c2);if(sheet&&sheet.draft.id===c2.id){sheet.draft={...sheet.draft,...prev};renderSheet()}}render();toast('Undone')}:null})}
function defaultLog(c){return {at:new Date().toISOString(),kind:c.emails_sent?'Follow-up':'First email',subject:c.emails_sent&&c.subject?'Re: '+c.subject:(c.subject||'')}}
async function delMail(id){if(!confirm('Remove this email from the history?'))return;const r=sheet.draft;const {error}=await sb.from('gs_emails').delete().eq('id',id);if(error)return toast(error.message,true);
emails=emails.filter(e=>e.id!==id);const t=emails.filter(e=>e.contact_id===r.id).map(e=>tms(e.sent_at)).sort((a,b)=>a-b);
const patch={emails_sent:Math.max(0,(r.emails_sent||0)-1),updated_at:new Date().toISOString()};if(t.length){patch.first_sent_at=new Date(t[0]).toISOString();patch.last_sent_at=new Date(t[t.length-1]).toISOString()}else if(!patch.emails_sent){patch.first_sent_at=null;patch.last_sent_at=null}
const {data:c,error:e2}=await sb.from('gs_contacts').update(patch).eq('id',r.id).select().single();if(e2)return toast(e2.message,true);replaceC(c);sheet.draft={...sheet.draft,...patch};renderSheet();render();toast('Removed')}
async function delContact(){const r=sheet.draft;if(!confirm(`Delete ${r.name}? Their email history will be deleted too.`))return;const {error}=await sb.from('gs_contacts').delete().eq('id',r.id);if(error)return toast(error.message,true);contacts=contacts.filter(c=>c.id!==r.id);emails=emails.filter(e=>e.contact_id!==r.id);dismiss();render();toast('Deleted')}

function norm(raw){const o={};for(const [k,v] of Object.entries(raw))o[String(k).trim().toLowerCase()]=v;return o}
function mapStatus(s){if(!s)return null;const t=s.trim().toLowerCase();if(['no reply','waiting for reply','no response','sent','emailed'].includes(t))return 'Emailed';return STATUS.find(x=>x.toLowerCase()===t)||s.trim()}
function parseContact(o,type){const g=(...ks)=>{for(const k of ks){const v=o[k];if(v!=null&&String(v).trim()!=='')return v}return null},S=(...ks)=>str(g(...ks));
const sentFlag=bool(g('cold email sent?','email sent?','emailed')),first=tsv(g('email sent date','date sent','first email sent','sent date','sent on')),last=tsv(g('last email sent date','last email sent','last sent'))||first;
const rep=bool(g('reply received?')),emailed=sentFlag===true||(!!first&&sentFlag!==false);let status=mapStatus(S('outcome','status'));

async function doImport(){if(!plan||busy)return;busy=true;render();
try{const strip=c=>{const r={...c};delete r.id;delete r.created_at;return r};
const byCode=new Map(contacts.map(c=>[c.contact_code,c])),byEm=new Map();contacts.forEach(c=>{const e=firstEmail(c).toLowerCase();if(e)byEm.set(e,c)});
const out=new Map(),outEm=new Map(),used=new Set(contacts.map(c=>c.contact_code)),logs=[];

if(!code&&em)code=outEm.get(em)||byEm.get(em)?.contact_code||null;if(!code){code=row.contact_code&&!used.has(row.contact_code)?row.contact_code:newCode(row.type,used);used.add(code)}

for(const [k,v] of Object.entries(row)){if(v==null||v==='')continue;if(k==='emails_sent')m[k]=Math.max(m[k]||0,v);else if(k==='first_sent_at')m[k]=m[k]&&tms(m[k])<tms(v)?m[k]:v;else if(k==='last_sent_at')m[k]=m[k]&&tms(m[k])>tms(v)?m[k]:v;else if(k==='type'&&base.type)continue;else m[k]=v}
m.contact_code=code;out.set(code,m);if(em)outEm.set(em,code)};
const order={business:1,creator:1,outreach:2,log:3};
for(const s of plan.sheets.filter(s=>s.role!=='skip').sort((a,b)=>order[a.role]-order[b.role])){for(const raw of s.rows){const o=norm(raw);
if(s.role==='log'){const l=parseLog(o);if(l.to||l.code)logs.push(l);continue}
if(s.role==='outreach'){const r=parseContact(o,'Creator');r.name=str(o['creator name']);r.contact_person=null;if(r.contact_code)put(r);continue}
let type=s.role==='creator'?'Creator':'Business';if(o.type&&/creator/i.test(o.type))type='Creator';else if(o.type&&/business|lead/i.test(o.type))type='Business';
const r=parseContact(o,type);if(!r.name&&!r.email&&!r.contact_code)continue;put(r)}}
const cnt={};for(const l of logs){let code=l.code&&(out.has(l.code)||byCode.has(l.code))?l.code:null;const em=String(l.to||'').split(/[;,\s]+/).find(x=>x.includes('@'))?.toLowerCase();if(!code&&em)code=outEm.get(em)||byEm.get(em)?.contact_code||null;l.code=code;

const now=new Date().toISOString(),rows=[...out.values()].map(m=>{const r={};CCOLS.forEach(k=>{if(m[k]!==undefined)r[k]=m[k]});if(!r.name)r.name=firstEmail(m)||m.contact_code;if(!r.type)r.type='Business';if(WAITING.includes(r.status)&&!r.next_follow_up&&r.last_sent_at)r.next_follow_up=addDays(ymd(new Date(r.last_sent_at)),3);r.updated_at=now;return r});
for(let i=0;i<rows.length;i+=500){const {error}=await sb.from('gs_contacts').upsert(rows.slice(i,i+500),{onConflict:'contact_code',defaultToNull:false});if(error)throw error}
contacts=await fetchAll('gs_contacts');const idBy=new Map(contacts.map(c=>[c.contact_code,c])),seen=new Set(),erows=[];
for(const l of logs){const c=l.code&&idBy.get(l.code);if(!c||seen.has(l.import_key))continue;seen.add(l.import_key);erows.push({contact_id:c.id,sent_at:l.sent_at||c.last_sent_at||now,kind:l.kind,to_email:l.to,subject:l.subject,gmail_thread:l.gmail_thread,import_key:l.import_key})}
for(let i=0;i<erows.length;i+=500){const {error}=await sb.from('gs_emails').upsert(erows.slice(i,i+500),{onConflict:'import_key',ignoreDuplicates:true});if(error)throw error}
