let sb=null,S={profile:{},goals:{},links:[],plans:[],tasks:[],notes:[],daily:[],log:{}},view='home',q='',sheet=null,drag=null,saving=0;
const pend=new Map();
function setSync(){$('sync').className='sync'+((saving+pend.size)?' on':'')}
function queue(t,r,delay=600){const k=t+':'+(r.id||r.key||r.day),p=pend.get(k);if(p)clearTimeout(p.timer);const timer=setTimeout(()=>{pend.delete(k);push(t,r)},delay);pend.set(k,{timer,t,r});setSync()}
async function push(t,r){saving++;setSync();const row={...r,updated_at:new Date().toISOString()};delete row.created_at;const {error}=await sb.from(t).upsert(row);saving--;setSync();if(error)toast("Couldn't save: "+error.message,true)}
function flush(){for(const [k,p] of pend){clearTimeout(p.timer);pend.delete(k);push(p.t,p.r)}}
async function remove(t,id){const k=t+':'+id,p=pend.get(k);if(p){clearTimeout(p.timer);pend.delete(k)}saving++;setSync();const {error}=await sb.from(t).delete().eq('id',id);saving--;setSync();if(error)toast("Couldn't delete: "+error.message,true)}
async function fetchT(t,order){const {data,error}=await sb.from(t).select('*').order(order,{ascending:true}).limit(5000);if(error)throw error;return data}
async function seed(){const D=defaults();for(const [t,rows] of [[TB.settings,[{key:'profile',value:D.profile},{key:'goals',value:D.goals}]],[TB.links,D.links],[TB.plans,D.plans],[TB.tasks,D.tasks],[TB.notes,D.notes],[TB.daily,D.daily]]){const {error}=await sb.from(t).upsert(rows);if(error)throw error}}

const lr=await sb.from(TB.log).select('*').gte('day',addDays(today(),-60));if(lr.error)throw lr.error;
const prof=st.find(r=>r.key==='profile');if(!again&&!prof&&!li.length&&!pl.length&&!no.length&&!da.length){await seed();return load(true)}

function fld(o,k,label,type='text',extra=''){return `<label class="f"><small>${label}</small><input type="${type}" data-f="${k}" value="${esc(o[k]??'')}" autocomplete="off" ${extra}></label>`}

function tog(o,k,label){return `<label class="f sw"><span>${label}</span><input type="checkbox" class="switch" data-f="${k}" ${o[k]?'checked':''}></label>`}
function tList(){return sheet.kind==='daily'?S.daily.slice().sort(bySort):tasksOf(sheet.obj.id)}
function tArr(){return sheet.kind==='daily'?S.daily:S.tasks}

const sc=keep&&sh.querySelector('.sbody')?sh.querySelector('.sbody').scrollTop:0,{kind,obj}=sheet;let title='',body='';

<div class="group">${fld(obj,'title','Name','text','autocapitalize="words"')}${fld(obj,'url','Link','url','inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://"')}<label class="f"><small>Group</small><select data-f="grp">${GROUPS.map(g=>`<option ${g===(obj.grp||'Other')?'selected':''}>${g}</option>`).join('')}</select></label>${fld(obj,'note','Note')}</div>
<div class="group">${tog(obj,'fav','Show on Home')}</div><button class="btn" data-x="delete">Delete link</button>`}
else if(kind==='plan'){const i=planInfo(obj);title=sheet.isNew?'New plan':'Plan';body=`<div class="group">${fld(obj,'title','Plan name')}${fld(obj,'sub','Short description')}${fld(obj,'start_date','Start date','date')}${fld(obj,'end_date','End date','date')}</div>
<p class="sec">Tasks · ${i.done} of ${i.total} done</p><div class="group">${taskRows()}</div><div class="group">${ta(obj,'notes','Notes')}</div><button class="btn" data-x="delete">Delete plan</button>`}
else if(kind==='note'){title=sheet.isNew?'New note':'Note';body=`<div class="group">${fld(obj,'title','Title')}</div><div class="group">${ta(obj,'body','Note','big')}</div><div class="group">${tog(obj,'pinned','Pin to top')}</div>${obj.updated_at?`<p class="meta" style="margin:-14px 16px 18px">Edited ${esc(rel(obj.updated_at))}</p>`:''}<button class="btn" data-x="delete">Delete note</button>`}
else if(kind==='profile'){title='Business profile';body=`<div class="group">${fld(obj,'name','Business name')}${fld(obj,'tagline','Tagline')}${fld(obj,'founder','Founder','text','autocapitalize="words"')}${fld(obj,'role','Role')}${fld(obj,'city','City')}</div><div class="group">${fld(obj,'email','Email','email','autocapitalize="off"')}${fld(obj,'phone','Phone / WhatsApp','tel')}${fld(obj,'website','Website','url','autocapitalize="off"')}</div><div class="group">${ta(obj,'goal','Long-term goal')}</div>`}
else if(kind==='daily'){title='Daily checklist';body=`<p class="sec">Everyday tasks</p><div class="group">${taskRows()}</div><div class="group">${fld(S.goals,'emailsGoal','Outreach emails per day','number','inputmode="numeric"')}</div><p class="note" style="margin-top:-14px">Ticks reset every morning.</p>`}
else if(kind==='goals'){title='Goals';body=`<div class="group">${fld(obj,'clients','Paying clients now','number','inputmode="numeric"')}${fld(obj,'target','Client target','number','inputmode="numeric"')}${fld(obj,'fee','Average monthly fee (₹)','number','inputmode="numeric"')}${fld(obj,'emailsGoal','Outreach emails per day','number','inputmode="numeric"')}</div>`}

function openSheet(kind,obj,isNew){sheet={kind,obj,isNew:!!isNew};renderSheet();history.pushState({gsm:1},'')}
function persist(){const k=sheet.kind;if(k==='link')queue(TB.links,sheet.obj);else if(k==='plan')queue(TB.plans,sheet.obj);else if(k==='note'){sheet.obj.updated_at=new Date().toISOString();queue(TB.notes,sheet.obj)}else if(k==='profile')queue(TB.settings,{key:'profile',value:S.profile});else queue(TB.settings,{key:'goals',value:S.goals})}
function finishSheet(){if(!sheet)return;const {kind,obj,isNew}=sheet;
if(kind==='link'&&obj.url&&!/^[a-z]+:/i.test(obj.url.trim())){obj.url='https://'+obj.url.trim();queue(TB.links,obj,0)}
if(isNew){const empty=kind==='link'?!obj.title&&!obj.url:kind==='note'?!obj.title&&!obj.body:kind==='plan'?!obj.title&&!tasksOf(obj.id).length:false;
if(empty){const arr=kind==='link'?S.links:kind==='note'?S.notes:S.plans,i=arr.indexOf(obj);if(i>=0)arr.splice(i,1);remove(kind==='link'?TB.links:kind==='note'?TB.notes:TB.plans,obj.id)}}
sheet=null;renderSheet();render()}
function closeSheet(){finishSheet();if(history.state&&history.state.gsm)history.back()}
async function addTask(){const inp=$('newtask');if(!inp||!sheet)return;const v=inp.value.trim();if(!v){inp.focus();return}
if(sheet.kind==='plan'){if(sheet.ready)await sheet.ready;const t={id:uuid(),plan_id:sheet.obj.id,title:v,done:false,sort:Date.now()};S.tasks.push(t);queue(TB.tasks,t,0)}
else{const t={id:uuid(),title:v,sort:Date.now()};S.daily.push(t);queue(TB.daily,t,0)}
renderSheet(true);const n=$('newtask');if(n)n.focus()}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-nav],[data-new],[data-open],[data-plan],[data-note],[data-link],[data-daily],[data-em],[data-cl],[data-tc],[data-tdel],[data-x]');if(!el)return;const d=el.dataset;
if(d.nav){view=d.nav;q='';render();window.scrollTo(0,0);return}
if(d.new){let o;if(d.new==='link'){o={id:uuid(),title:'',url:'',grp:'Other',note:'',fav:false,sort:Date.now()};S.links.push(o);openSheet('link',o,true)}
else if(d.new==='note'){o={id:uuid(),title:'',body:'',pinned:false,updated_at:new Date().toISOString()};S.notes.push(o);openSheet('note',o,true)}
else{o={id:uuid(),title:'',sub:'',start_date:null,end_date:null,notes:'',sort:Date.now()};S.plans.push(o);openSheet('plan',o,true);sheet.ready=push(TB.plans,o)}return}
if(d.open){openSheet(d.open,d.open==='profile'?S.profile:S.goals);return}
if(d.plan){const o=S.plans.find(x=>x.id===d.plan);if(o)openSheet('plan',o);return}
if(d.note){const o=S.notes.find(x=>x.id===d.note);if(o)openSheet('note',o);return}
if(d.link){e.preventDefault();const o=S.links.find(x=>x.id===d.link);if(o)openSheet('link',o);return}
if(d.daily){const lg=dayLog(),i=lg.done.indexOf(d.daily);if(i>=0)lg.done.splice(i,1);else lg.done.push(d.daily);queue(TB.log,lg,300);render();return}
if(d.em){const lg=dayLog();lg.emails=Math.max(0,lg.emails+Number(d.em));queue(TB.log,lg,400);render();return}
if(d.cl){S.goals.clients=Math.max(0,(Number(S.goals.clients)||0)+Number(d.cl));queue(TB.settings,{key:'goals',value:S.goals},400);render();return}
if(d.tc&&sheet){const t=S.tasks.find(x=>x.id===d.tc);if(t){t.done=!t.done;queue(TB.tasks,t,0);renderSheet(true)}return}
if(d.tdel&&sheet){const arr=tArr(),i=arr.findIndex(x=>x.id===d.tdel);if(i>=0){arr.splice(i,1);remove(tTable(),d.tdel);renderSheet(true)}return}
const x=d.x;
if(x==='close'){closeSheet();return}
if(x==='addtask'){addTask();return}
if(x==='copy'){try{await navigator.clipboard.writeText(sheet.obj.url);toast('Link copied')}catch(_){toast('Could not copy',true)}return}
if(x==='share'){const o=sheet.obj;if(navigator.share){try{await navigator.share({title:o.title,url:o.url})}catch(_){}}else{try{await navigator.clipboard.writeText(o.url);toast('Link copied')}catch(_){}}return}
if(x==='delete'&&sheet){const {kind,obj}=sheet;if(!confirm(`Delete this ${kind}?`))return;const arr=kind==='link'?S.links:kind==='note'?S.notes:S.plans,i=arr.indexOf(obj);if(i>=0)arr.splice(i,1);
if(kind==='plan')S.tasks=S.tasks.filter(t=>t.plan_id!==obj.id);remove(kind==='link'?TB.links:kind==='note'?TB.notes:TB.plans,obj.id);sheet=null;renderSheet();render();if(history.state&&history.state.gsm)history.back();toast('Deleted');return}
if(x==='refresh'){flush();try{await load(true);render();toast('Up to date')}catch(err){toast(err.message,true)}return}
if(x==='backup'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`GS Master backup ${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Backup downloaded');return}
if(x==='retry'){boot();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){closeSheet();return}if(e.key==='Enter'&&e.target.id==='newtask'){e.preventDefault();addTask();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='q'){q=el.value;const l=$('list');if(l)l.innerHTML=view==='links'?linksList():notesList();return}
if(!sheet||el.type==='checkbox')return;
if(el.dataset.tt){const t=tArr().find(x=>x.id===el.dataset.tt);if(t){t.title=el.value;queue(tTable(),t)}return}
const k=el.dataset.f;if(!k)return;const o=(sheet.kind==='daily'||sheet.kind==='goals')?S.goals:sheet.kind==='profile'?S.profile:sheet.obj;
let v=el.type==='number'?(el.value===''?0:Number(el.value)):el.value;if(el.type==='date'&&!v)v=null;o[k]=v;persist()});
document.addEventListener('change',e=>{const el=e.target;if(!sheet||!el.dataset.f)return;if(el.type==='checkbox'){sheet.obj[el.dataset.f]=el.checked;persist()}else if(el.tagName==='SELECT'){sheet.obj[el.dataset.f]=el.value;persist()}});
sh.addEventListener('touchstart',e=>{const s=e.target.closest('.sheet');if(!s)return;const onHandle=!!e.target.closest('.shandle'),b=s.querySelector('.sbody');if(!onHandle&&(b.scrollTop>0||e.target.closest('input,textarea,select')))return;drag={y:e.touches[0].clientY,s,dy:0}},{passive:true});
sh.addEventListener('touchmove',e=>{if(!drag)return;drag.dy=Math.max(0,e.touches[0].clientY-drag.y);drag.s.style.transition='none';drag.s.style.transform=drag.dy?`translateY(${drag.dy}px)`:''},{passive:true});
sh.addEventListener('touchend',()=>{if(!drag)return;const {s,dy}=drag;drag=null;s.style.transition='transform .22s ease';if(dy>120){s.style.transform='translateY(100%)';setTimeout(closeSheet,200)}else s.style.transform=''});
addEventListener('popstate',()=>{if(sheet)finishSheet()});
addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>30),{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
addEventListener('pagehide',flush);

async function boot(){if(!window.supabase||!window.supabase.createClient){app.innerHTML='<div class="empty"><b>No connection</b>Connect to the internet and refresh.</div>';return}
sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});app.innerHTML='<div class="empty">Loading your business hub…</div>';
try{await load();render()}catch(err){app.innerHTML=`<div class="empty"><b>Couldn't load</b>${esc(/does not exist|schema cache|Could not find/i.test(err.message)?'Run the SQL setup in Supabase first.':err.message)}<br><br><button class="btn pri" data-x="retry">Try again</button></div>`}}
boot();
})();
</script>
