<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#fff}
body{margin:0;color:var(--t);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
svg{width:22px;height:22px;flex:none}
.top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--sp)}
.top-in{max-width:720px;margin:0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 20px}
.add{width:34px;height:34px;border-radius:50%;background:var(--f);color:var(--b);display:grid;place-items:center}.add svg{width:20px;height:20px}

h1{font-size:32px;font-weight:700;margin:0 0 4px;letter-spacing:-.8px}

.sec{font-size:13px;font-weight:600;color:var(--s);text-transform:uppercase;letter-spacing:.5px;margin:0 4px 10px;display:flex;justify-content:space-between}

.card,.group{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:var(--sh);margin-bottom:24px}
.card{display:block;width:100%;padding:18px;text-align:left;color:var(--t);transition:transform .15s}
button.card:active,.ql:active,.cb:active{transform:scale(.97)}
.group{overflow:hidden}
.row{display:flex;gap:12px;align-items:center;width:100%;min-height:54px;padding:10px 16px;position:relative;color:var(--t);text-decoration:none}
.row+.row::before{content:'';position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sp)}

.rc{flex:1;min-width:0;display:grid;gap:2px}
.lk{flex:1;min-width:0;display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;cursor:pointer}
.t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:13px;color:var(--s);margin:8px 0 0}
.done{text-decoration:line-through;color:#aeaeb2}
.av{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;background:#0071e3}
.av.lg{width:58px;height:58px;border-radius:50%;font-size:20px;background:linear-gradient(135deg,#0066ff,#081534)}
.av.sm{width:30px;height:30px;border-radius:9px;font-size:11px}
.who{display:flex;align-items:center;gap:14px;margin-bottom:16px}.who b{display:block;font-size:19px}

.cb{flex:1;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--b);text-decoration:none;padding:11px 0;border-radius:14px;background:#f5f5f7}
.cb.off{opacity:.35;pointer-events:none}

.big{display:flex;align-items:center;gap:16px}.big b{display:block;font-size:24px;font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 12px);z-index:21;max-width:680px;margin:0 auto;background:#f7f7f9;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.12);animation:up .35s cubic-bezier(.2,.9,.25,1)}

.sbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;background:#fff;border-bottom:1px solid var(--sp)}
.sbar button{color:var(--b);font-weight:600;font-size:17px}
.sbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.sbody .group{box-shadow:none}
.f{display:block;padding:10px 16px;position:relative}
.f+.f::before{content:'';position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sp)}
.f small{display:block;font-size:12px;font-weight:600;color:var(--s);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.f input,.f textarea,.f select,.tin{width:100%;border:0;background:none;outline:none;padding:2px 0;font-size:17px;min-height:26px;-webkit-appearance:none;appearance:none;color:var(--t)}
.f select{color:var(--b)}
.f textarea{min-height:84px;resize:vertical}.f textarea.tall{min-height:45vh}
.sw{display:flex;align-items:center;justify-content:space-between}
.f input.tg{width:51px;height:31px;min-height:0;border-radius:31px;background:#e9e9eb;position:relative;flex:none;transition:.2s;padding:0}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.2s}
.f input.tg:checked{background:var(--g)}.tg:checked::after{transform:translateX(20px)}
.tin{flex:1;min-width:0;font-size:16px}
.x{color:#c7c7cc;font-size:24px;padding:0 6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.act{background:#fff;border:1px solid var(--l);border-radius:14px;padding:12px;text-align:center;color:var(--b);font-weight:600;text-decoration:none}
.del{display:block;width:100%;background:#fff;border:1px solid var(--l);color:var(--r);border-radius:14px;padding:14px;text-align:center}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;z-index:40;background:#1d1d1f;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;transition:.3s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}.toast.bad{background:var(--r)}
</style>
</head>

<p class="sec">Today<button data-open="daily">Edit</button></p>
<div class="card"><div class="big"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" stroke="#f2f2f7"/><circle cx="18" cy="18" r="15.5" stroke="#34c759" stroke-dasharray="${(dn/tot*97.4).toFixed(1)} 97.4"/></svg><div><b>${dn} of ${tot}</b><span class="s">${dn===tot?'All done today':'daily tasks done'}</span></div></div></div>
<div class="group">${dl.map(t=>{const on=l.done.includes(t.id);return `<button class="row" data-day="${t.id}"><span class="ck ${on?'on':''}">${IC.check}</span><span class="t ${on?'done':''}">${E(t.title)}</span></button>`}).join('')}<div class="row"><span class="ck ${em?'on':''}">${IC.check}</span><span class="t ${em?'done':''}" style="flex:1">Outreach emails · ${l.emails}/${g.emails}</span><span class="step"><button data-em="-1">−</button><button data-em="1">+</button></span></div></div>
${run.length?'<p class="sec">Running plans</p>'+run.map(pc).join('')+'<div style="height:12px"></div>':''}
<p class="sec">Goal</p><div class="card"><div class="ph"><div><b style="font-size:24px">${g.clients} of ${g.target}</b><div class="s">paying clients</div></div><span class="step"><button data-cl="-1">−</button><button data-cl="1">+</button></span></div><div class="bar"><i style="width:${Math.min(100,g.clients/Math.max(1,g.target)*100)}%"></i></div><p class="m">Monthly revenue ${rs(g.clients*g.fee)} · at ${g.target} clients ${rs(g.target*g.fee)}</p></div>
${fav.length?'<p class="sec">Quick links</p><div class="qls">'+fav.map(x=>`<a class="ql" href="${E(x.url)}" target="_blank" rel="noopener"><span class="av sm" style="background:${GC[x.grp]||GC.Other}">${E(ini(x.title))}</span><span class="t">${E(x.title)}</span></a>`).join('')+'</div>':''}
${p.goal?`<p class="sec">Long-term goal</p><div class="card"><p style="margin:0;color:#424245">${E(p.goal)}</p></div>`:''}</main>`}
function lrow(x){return `<div class="row"><a class="lk" ${x.url?`href="${E(x.url)}" target="_blank" rel="noopener"`:`data-link="${x.id}"`}><span class="av" style="background:${GC[x.grp]||GC.Other}">${E(ini(x.title))}</span><span class="rc"><span class="t">${E(x.title||'Untitled')}${x.fav?' ★':''}</span><span class="s">${E(x.url?host(x.url):'Tap to add the link')}</span></span>${x.url?'':'<span class="badge">Add link</span>'}</a><button class="ed" data-link="${x.id}" aria-label="Edit">${IC.dots}</button></div>`}
function links(){const s=q.toLowerCase(),L=S.links.filter(x=>!s||[x.title,x.url,x.grp].join(' ').toLowerCase().includes(s)).sort(so);return GR.filter(g=>L.some(x=>(x.grp||'Other')===g)).map(g=>`<p class="sec">${g}</p><div class="group">${L.filter(x=>(x.grp||'Other')===g).map(lrow).join('')}</div>`).join('')||'<p class="empty">No links found</p>'}
function notes(){const s=q.toLowerCase(),L=S.notes.filter(n=>!s||[n.title,n.body].join(' ').toLowerCase().includes(s)).sort((a,b)=>(b.pinned-a.pinned)||(new Date(b.updated_at||0)-new Date(a.updated_at||0)));return L.length?`<div class="group">${L.map(n=>`<button class="row" data-note="${n.id}"><span class="rc"><span class="t" style="font-weight:600">${E(n.title||'Untitled')}</span><span class="s">${E((n.body||'').split('\n')[0]||'No text')}</span></span>${n.pinned?'<span class="badge">Pinned</span>':''}</button>`).join('')}</div>`:'<p class="empty">No notes</p>'}
const blue=t=>`<span class="t" style="color:#0071e3">${t}</span>`;
const pages={home,
links:()=>hdr('link')+`<main class="wrap"><h1>Links</h1><p class="sub">${S.links.filter(x=>x.url).length} saved · ${S.links.filter(x=>!x.url).length} to add</p>${srch('Search links')}<div id="list">${links()}</div></main>`,
plans:()=>hdr('plan')+`<main class="wrap"><h1>Plans</h1><p class="sub">${S.plans.length} plans · ${S.tasks.filter(t=>!t.done).length} open tasks</p>${S.plans.slice().sort(so).map(pc).join('')||'<p class="empty">No plans yet. Tap +</p>'}</main>`,
notes:()=>hdr('note')+`<main class="wrap"><h1>Notes</h1><p class="sub">${S.notes.length} notes</p>${srch('Search notes')}<div id="list">${notes()}</div></main>`,
more:()=>hdr()+`<main class="wrap"><h1>More</h1><p class="sub">Settings and data</p><div class="group"><button class="row" data-open="profile">${blue('Business profile')}</button><button class="row" data-open="daily">${blue('Daily checklist')}</button><button class="row" data-open="goals">${blue('Goals')}</button></div><div class="group"><button class="row" data-x="refresh">${blue('Refresh from cloud')}</button><button class="row" data-x="backup">${blue('Download backup')}</button></div><p class="m" style="margin:-10px 4px">Saved in Supabase · same on phone and laptop · v4</p></main>`};
function render(){$('tabs').innerHTML='<div>'+[['home','Home',IC.home],['links','Links',IC.link],['plans','Plans',IC.plan],['notes','Notes',IC.note],['more','More',IC.more]].map(([k,l,i])=>`<button class="tab ${view===k?'on':''}" data-nav="${k}">${i}${l}</button>`).join('')+'</div>';app.innerHTML=pages[view]()}

const F=(o,k,l,t='text')=>`<label class="f"><small>${l}</small><input type="${t}" data-f="${k}" value="${E(o[k])}" autocomplete="off"></label>`;
const A=(o,k,l,c='')=>`<label class="f"><small>${l}</small><textarea class="${c}" data-f="${k}">${E(o[k])}</textarea></label>`;
const G=(o,k,l)=>`<label class="f sw"><span>${l}</span><input type="checkbox" class="tg" data-f="${k}" ${o[k]?'checked':''}></label>`;
const trows=(list,ck)=>list.map(t=>`<div class="row">${ck?`<button class="ck ${t.done?'on':''}" data-tc="${t.id}">${IC.check}</button>`:''}<input class="tin ${t.done?'done':''}" data-tt="${t.id}" value="${E(t.title)}"><button class="x" data-td="${t.id}">×</button></div>`).join('')+`<div class="row"><input class="tin" id="nt" placeholder="+ Add a task" enterkeyhint="done"><button style="color:#0071e3;font-weight:600" data-x="addt">Add</button></div>`;
function rs(keep){if(!sheet){sh.innerHTML='';document.body.classList.remove('lock');return}document.body.classList.add('lock');const b0=sh.querySelector('.sbody'),y=keep&&b0?b0.scrollTop:0,{k,o}=sheet;let t,b;
if(k==='link'){t='Link';b=`${o.url?`<div class="acts"><a class="act" href="${E(o.url)}" target="_blank" rel="noopener">Open</a><button class="act" data-x="copy">Copy</button></div>`:''}<div class="group">${F(o,'title','Name')}${F(o,'url','Link','url')}<label class="f"><small>Group</small><select data-f="grp">${GR.map(g=>`<option ${g===(o.grp||'Other')?'selected':''}>${g}</option>`).join('')}</select></label>${F(o,'note','Note')}</div><div class="group">${G(o,'fav','Show on Home')}</div><button class="del" data-x="del">Delete link</button>`}
else if(k==='plan'){const i=info(o);t='Plan';b=`<div class="group">${F(o,'title','Plan name')}${F(o,'sub','Short description')}${F(o,'start_date','Start date','date')}${F(o,'end_date','End date','date')}</div><p class="sec">Tasks · ${i.done} of ${i.total} done</p><div class="group">${trows(tk(o.id),1)}</div><div class="group">${A(o,'notes','Notes')}</div><button class="del" data-x="del">Delete plan</button>`}
else if(k==='note'){t='Note';b=`<div class="group">${F(o,'title','Title')}</div><div class="group">${A(o,'body','Note','tall')}</div><div class="group">${G(o,'pinned','Pin to top')}</div><button class="del" data-x="del">Delete note</button>`}
else if(k==='profile'){t='Business profile';b=`<div class="group">${[['name','Business name'],['tagline','Tagline'],['founder','Founder'],['role','Role'],['city','City'],['email','Email'],['phone','Phone / WhatsApp'],['website','Website']].map(([a,c])=>F(o,a,c)).join('')}</div><div class="group">${A(o,'goal','Long-term goal')}</div>`}
else if(k==='daily'){t='Daily checklist';b=`<div class="group">${trows(S.daily.slice().sort(so),0)}</div><div class="group">${F(S.goals,'emails','Outreach emails per day','number')}</div>`}
else{t='Goals';b=`<div class="group">${F(o,'clients','Paying clients now','number')}${F(o,'target','Client target','number')}${F(o,'fee','Average monthly fee (₹)','number')}${F(o,'emails','Outreach emails per day','number')}</div>`}
sh.innerHTML=`<div class="scrim" data-x="close"></div><section class="sheet"><div class="sbar"><b>${t}</b><button data-x="close">Done</button></div><div class="sbody">${b}</div></section>`;if(keep)sh.querySelector('.sbody').scrollTop=y}
function openS(k,o,isNew){if(!o)return;sheet={k,o,isNew};rs();history.pushState({s:1},'')}
function fin(){if(!sheet)return;const {k,o,isNew}=sheet;if(k==='link'&&o.url&&!/^[a-z]+:/i.test(o.url)){o.url='https://'+o.url.trim();put(T.li,o,0)}
if(isNew&&(k==='link'?!o.title&&!o.url:k==='note'?!o.title&&!o.body:k==='plan'?!o.title&&!tk(o.id).length:false)){const a=k==='link'?S.links:k==='note'?S.notes:S.plans;a.splice(a.indexOf(o),1);drop(k==='link'?T.li:k==='note'?T.no:T.pl,o.id)}
sheet=null;rs();render()}
function closeS(){fin();if(history.state&&history.state.s)history.back()}
function sv(){const {k,o}=sheet;if(k==='link')put(T.li,o);else if(k==='plan')put(T.pl,o);else if(k==='note'){o.updated_at=new Date().toISOString();put(T.no,o)}else if(k==='profile')put(T.st,{key:'profile',value:S.profile});else put(T.st,{key:'goals',value:S.goals})}
async function addT(){const i=$('nt'),v=i&&i.value.trim();if(!v)return;let t;if(sheet.k==='plan'){if(sheet.ready)await sheet.ready;t={id:uid(),plan_id:sheet.o.id,title:v,done:false,sort:Date.now()};S.tasks.push(t);put(T.ta,t,0)}else{t={id:uid(),title:v,sort:Date.now()};S.daily.push(t);put(T.da,t,0)}rs(1);$('nt').focus()}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-nav],[data-new],[data-open],[data-plan],[data-note],[data-link],[data-day],[data-em],[data-cl],[data-tc],[data-td],[data-x]');if(!el)return;const d=el.dataset;
if(d.nav){view=d.nav;q='';render();scrollTo(0,0)}
else if(d.new){const o=d.new==='link'?{id:uid(),title:'',url:'',grp:'Other',note:'',fav:false,sort:Date.now()}:d.new==='note'?{id:uid(),title:'',body:'',pinned:false,updated_at:new Date().toISOString()}:{id:uid(),title:'',sub:'',start_date:null,end_date:null,notes:'',sort:Date.now()};(d.new==='link'?S.links:d.new==='note'?S.notes:S.plans).push(o);openS(d.new,o,1);if(d.new==='plan')sheet.ready=send(T.pl,o)}
else if(d.open)openS(d.open,d.open==='profile'?S.profile:S.goals);
else if(d.plan)openS('plan',S.plans.find(x=>x.id===d.plan));
else if(d.note)openS('note',S.notes.find(x=>x.id===d.note));
else if(d.link){e.preventDefault();openS('link',S.links.find(x=>x.id===d.link))}
else if(d.day){const l=lgT(),i=l.done.indexOf(d.day);if(i<0)l.done.push(d.day);else l.done.splice(i,1);put(T.lg,l,300);render()}
else if(d.em){const l=lgT();l.emails=Math.max(0,l.emails+Number(d.em));put(T.lg,l,400);render()}
else if(d.cl){S.goals.clients=Math.max(0,(Number(S.goals.clients)||0)+Number(d.cl));put(T.st,{key:'goals',value:S.goals},400);render()}
else if(d.tc){const t=S.tasks.find(x=>x.id===d.tc);if(t){t.done=!t.done;put(T.ta,t,0);rs(1)}}
else if(d.td){const a=sheet.k==='daily'?S.daily:S.tasks,i=a.findIndex(x=>x.id===d.td);if(i>=0){a.splice(i,1);drop(sheet.k==='daily'?T.da:T.ta,d.td);rs(1)}}
else{const x=d.x;
if(x==='close')closeS();
else if(x==='addt')addT();
else if(x==='copy'){try{await navigator.clipboard.writeText(sheet.o.url);toast('Link copied')}catch(_){toast('Could not copy',true)}}
else if(x==='del'){const {k,o}=sheet;if(!confirm('Delete this '+k+'?'))return;const a=k==='link'?S.links:k==='note'?S.notes:S.plans;a.splice(a.indexOf(o),1);if(k==='plan')S.tasks=S.tasks.filter(t=>t.plan_id!==o.id);drop(k==='link'?T.li:k==='note'?T.no:T.pl,o.id);sheet=null;rs();render();if(history.state&&history.state.s)history.back();toast('Deleted')}
else if(x==='refresh'){flush();try{await load(1);render();toast('Up to date')}catch(err){toast(err.message,true)}}
else if(x==='backup'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='GS Master backup '+day()+'.json';document.body.appendChild(a);a.click();a.remove()}
else if(x==='retry')boot()}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='q'){q=el.value;const l=$('list');if(l)l.innerHTML=view==='links'?links():notes();return}
if(!sheet||el.type==='checkbox'||el.tagName==='SELECT')return;
if(el.dataset.tt){const t=(sheet.k==='daily'?S.daily:S.tasks).find(x=>x.id===el.dataset.tt);if(t){t.title=el.value;put(sheet.k==='daily'?T.da:T.ta,t)}return}
const k=el.dataset.f;if(!k)return;const o=sheet.k==='daily'?S.goals:sheet.o;o[k]=el.type==='number'?(Number(el.value)||0):el.type==='date'?(el.value||null):el.value;sv()});
document.addEventListener('change',e=>{const el=e.target;if(!sheet||!el.dataset.f)return;if(el.type==='checkbox'){sheet.o[el.dataset.f]=el.checked;sv()}else if(el.tagName==='SELECT'){sheet.o[el.dataset.f]=el.value;sv()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nt'){e.preventDefault();addT()}if(e.key==='Escape'&&sheet)closeS()});
addEventListener('popstate',()=>{if(sheet)fin()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
async function boot(){app.innerHTML='<p class="empty">Loading…</p>';try{await load();render()}catch(err){app.innerHTML=`<div class="empty"><b>Couldn't load</b><p>${E(/schema cache|does not exist|Could not find/i.test(err.message)?'Run the gsm_ SQL setup in Supabase first.':err.message)}</p><button class="act" data-x="retry">Try again</button></div>`}}
boot();
})();
</script>
</body>
</html>
